<meta charset="utf-8">
<title>Rim Station 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: control-room console. Station view left, director's clipboard right, Stardew-style dialog docked over the view. One dark world, by choice. */
:root{
  --void:#110a20; --panel:#1b1430; --panel-2:#251c3e; --line:#3a2e5e;
  --ink:#ece7f6; --dim:#a194c0; --amber:#f39a2b; --glass:#62d6e3; --hazard:#ff5d63; --ok:#8bd472;
  --parch:#f2e3c2; --parch-ink:#3b2516; --wood:#c3843a; --wood-dark:#5b3519;
  --f-display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-label:"Silkscreen", ui-monospace, "Courier New", monospace;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-data);font-size:14.5px;line-height:1.45}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1}
.brand small{display:block;font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.12em;color:var(--dim);margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--dim);margin-right:6px}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.chip.bad{border-color:var(--hazard);color:var(--hazard)}
.speed{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.speed button{background:var(--panel);border:0;border-left:1px solid var(--line);padding:6px 10px;cursor:pointer;font-family:var(--f-label);font-size:11.5px;letter-spacing:.06em;color:var(--dim)}
.speed button:first-child{border-left:0}
.speed button[aria-pressed="true"]{background:var(--amber);color:#1c1005}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px}
.view{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0b0615;touch-action:none}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;cursor:grab}
#cv.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;z-index:2;display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel)}
.zoom button{background:none;border:0;border-left:1px solid var(--line);min-width:32px;padding:6px 8px;cursor:pointer;font-family:var(--f-label);font-size:12.5px;color:var(--ink)}
.zoom button:first-child{border-left:0}
.zoom button:hover{background:var(--panel-2)}
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 2px 9px;cursor:pointer;font-family:var(--f-label);font-size:11px;letter-spacing:.06em;color:var(--dim);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs .dot{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--hazard)}
.pane{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
fieldset.card{margin:0}
.card.alert{border-color:var(--hazard)}
.eyebrow{font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:0}
h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15;text-wrap:balance}
p{margin:0}
.muted{color:var(--dim)}
.small{font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.spec-head{display:flex;gap:12px;align-items:center}
.spec-head canvas{width:60px;height:36px;image-rendering:pixelated;background:#0d1a20;border:1px solid var(--line);border-radius:3px;flex-shrink:0}
.doss{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:5px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0;padding-bottom:0}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h b{font-family:var(--f-display);font-weight:600;font-size:16px}
.box{width:12px;height:12px;border:2px solid var(--line);border-radius:2px;flex-shrink:0;display:grid;place-items:center}
.box.on{border-color:var(--ok);background:var(--ok)}
.box.on::after{content:"";width:4px;height:4px;background:#14240f}
.box.flag{border-color:var(--hazard)}
.box.flag::after{content:"";width:6px;height:2px;background:var(--hazard)}
.claim{font-size:13.5px;padding-left:20px}
.claim .by{color:var(--dim)}
.claim.empty{color:var(--dim)}
.claim.flag{color:var(--hazard)}
.studies{display:flex;flex-direction:column;gap:4px;padding-left:20px}
.study{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 8px;cursor:pointer;font-size:13.5px}
.study:hover{border-color:var(--dim)}
.study.sel{border-color:var(--amber);background:#2c2140}
.study.follow{margin-left:14px;width:calc(100% - 14px)}
.specs{display:flex;flex-direction:column;gap:4px}
.spec{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:4px 8px 4px 4px;cursor:pointer}
.spec canvas{width:54px;height:39px;image-rendering:pixelated;border-radius:2px;flex-shrink:0}
.spec b{display:block;font-weight:600;font-size:14px}
.spec small{display:block;color:var(--dim);font-size:12.5px}
.spec.sel{border-color:var(--amber);background:#2c2140}
.spec-head canvas{width:54px;height:39px}
.tag-safe,.tag-flip{font-family:var(--f-label);font-size:9.5px;letter-spacing:.05em;padding:2px 4px;border-radius:2px}
.tag-safe{color:var(--ok);border:1px solid var(--ok)}
.tag-flip{color:var(--amber);border:1px solid var(--amber)}
.safe-note,.flip-note{font-size:13px;line-height:1.4;padding:6px 8px;border-radius:3px}
.safe-note{color:var(--ok);background:rgba(139,212,114,.08);border:1px solid rgba(139,212,114,.35)}
.flip-note{color:var(--amber);background:rgba(243,154,43,.08);border:1px solid rgba(243,154,43,.35)}
.planet-h{display:flex;gap:12px;align-items:center}
.planet-h canvas{width:72px;height:72px;image-rendering:pixelated;flex-shrink:0}
.planet.unknown{opacity:.75;border-style:dashed}
.tabs button{font-size:10.5px;letter-spacing:.04em}
.st-locked{color:var(--dim)}
.pills{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tierpill{font-family:var(--f-label);font-size:10px;letter-spacing:.06em;color:var(--dim)}
.pill{font-family:var(--f-label);font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;border:1px solid var(--line);white-space:nowrap;color:var(--dim)}
.st-open .pill{border-color:var(--glass);color:var(--glass)}
.st-running .pill{border-color:var(--amber);color:var(--amber)}
.st-done .pill{border-color:var(--ok);color:var(--ok)}
.st-flagged .pill{border-color:var(--hazard);color:var(--hazard)}
.check{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13.5px;cursor:pointer}
.check input{margin:2px 0 0;accent-color:var(--amber)}
.check small{display:block;color:var(--dim);font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.seg label{padding:5px 11px;cursor:pointer;border-left:1px solid var(--line);font-variant-numeric:tabular-nums}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--amber);color:#1c1005}
.seg label:has(input:focus-visible){outline:2px solid var(--glass);outline-offset:-2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.est{font-size:13.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.why{font-size:13px;color:var(--amber)}
.hint{font-size:13px;color:var(--glass)}
.btn{font-family:var(--f-label);font-size:11.5px;letter-spacing:.06em;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 11px;cursor:pointer;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1c1005}
.btn.danger{border-color:var(--hazard);color:var(--hazard)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
.bar{height:8px;background:#120c22;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.bar.int i{background:var(--glass)}
.bar.int.low i{background:var(--hazard)}
.lead{flex-direction:row;gap:12px;align-items:flex-start}
.lead.current{border-color:var(--amber)}
.pt{width:56px;height:56px;image-rendering:pixelated;border:2px solid var(--wood-dark);border-radius:3px;flex-shrink:0}
.lead-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.tag{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;color:var(--amber)}
.traits{font-size:13px;color:var(--dim)}
.techs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.techs li{display:flex;justify-content:space-between;gap:8px}
.techs .dead{color:var(--dim);text-decoration:line-through}
.claims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.claims li{display:flex;flex-direction:column;gap:2px;font-size:13.5px;padding-left:10px;border-left:3px solid var(--line)}
.claims li.ok{border-left-color:var(--ok)}
.claims li.bad{border-left-color:var(--hazard)}
.claims li.new{border-left-color:var(--glass)}
.claims b{font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
.claims .st{font-size:12.5px;color:var(--dim)}
.claims li.bad .st{color:var(--hazard)}
.claims li.new .st{color:var(--glass)}
.claims li.ok .st{color:var(--ok)}
.labs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.labs li{display:flex;justify-content:space-between;gap:10px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.note{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.note .meta{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:2px}
.note.k-finding{border-left-color:var(--ok)}
.note.k-anomaly{border-left-color:var(--glass)}
.note.k-warning{border-left-color:var(--hazard)}
.note.k-admin{border-left-color:#7d6fae}
.dlg{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;display:flex;gap:12px;align-items:flex-start;background:var(--parch);color:var(--parch-ink);border:3px solid var(--wood);box-shadow:0 0 0 3px var(--wood-dark),0 6px 0 3px rgba(0,0,0,.35);border-radius:4px;padding:12px;cursor:pointer;max-height:calc(100% - 20px);overflow:auto}
.dlg-pt{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.dlg-pt canvas{width:80px;height:80px;image-rendering:pixelated;border:3px solid var(--wood-dark);border-radius:3px;background:var(--wood)}
.dlg-pt span{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;color:var(--wood-dark)}
.dlg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dlg-name{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.1}
.dlg-role{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;color:#7a5634}
.dlg-text{font-family:var(--f-display);font-size:17.5px;line-height:1.35;min-height:2.7em;max-width:70ch}
.dlg-choices{display:flex;flex-wrap:wrap;gap:8px}
.dlg-choices button{font-family:var(--f-display);font-size:16px;background:#fff6e0;border:2px solid var(--wood-dark);border-radius:3px;padding:6px 12px;cursor:pointer;color:var(--parch-ink)}
.dlg-choices button:hover{background:#ffe9b8}
.dlg-hint{font-family:var(--f-label);font-size:10.5px;letter-spacing:.08em;color:#8a6640;align-self:flex-end}
.toast{position:absolute;left:10px;top:10px;z-index:4;display:flex;gap:8px;align-items:center;max-width:min(420px, calc(100% - 140px));background:rgba(27,20,48,.94);border:1px solid var(--line);border-radius:4px;padding:6px 10px 6px 6px;font-size:13.5px}
.toast canvas{width:32px;height:32px;image-rendering:pixelated;border-radius:2px;flex-shrink:0}
.toast b{display:block;font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
.ovl{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:12px;background:rgba(14,6,20,.6)}
.ovl.breach{z-index:3;background:rgba(40,4,10,.45)}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet > *{flex-shrink:0}
.breach .sheet{border:2px solid var(--hazard)}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.1;text-wrap:balance}
.breach h2{color:var(--hazard)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ladder li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:3px;background:var(--panel-2)}
.ladder li.off{opacity:.4}
.ladder .n{font-family:var(--f-label);font-size:12.5px;color:var(--hazard);text-align:center}
.ladder b{display:block;font-weight:600}
.ladder small{display:block;color:var(--dim);font-size:13px;line-height:1.35}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.statgrid div{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.statgrid b{display:block;font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
.statgrid span{font-variant-numeric:tabular-nums;font-size:16.5px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-label);font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--dim)}
td.ok{color:var(--ok)} td.bad{color:var(--hazard)} td.miss{color:var(--amber)}
@media (max-width: 900px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .view{height:min(70vh, 520px);min-height:340px}
  .pane{overflow:visible}
  .stats{order:3;flex-basis:100%}
  .chip{white-space:normal}
}
@media (max-width: 480px){
  .dlg-pt canvas{width:56px;height:56px}
  .dlg-text{font-size:16.5px}
}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
.starmap{width:100%;height:auto;aspect-ratio:340/220;image-rendering:pixelated;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:#0a0616}
.card.guide{border-color:var(--amber);background:linear-gradient(180deg,rgba(243,154,43,.10),rgba(243,154,43,0) 70%),var(--panel-2)}
.card.guide .eyebrow{color:var(--amber)}
.hud-title{position:absolute;left:12px;top:10px;z-index:2;pointer-events:none;text-shadow:0 2px 0 #0b0615,0 0 8px #0b0615}
.hud-bar{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;pointer-events:none}
.hud-bar > *{pointer-events:auto}
.hud-bar .chip{background:rgba(27,20,48,.9)}
.hud-tr{position:absolute;right:10px;top:10px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hud-tr .zoom{position:static}
.chip{padding:4px 7px}
.toast{top:62px}
#study .sheet{max-width:560px}
#report .sheet{max-width:620px}
/* Full-view sheets. Styled on the class, not per id, so a new sheet is placed and
   stacked correctly without being added here: above the HUD controls, which sit at 2. */
.plan-ovl{position:absolute;inset:0;z-index:4;background:rgba(14,6,20,.72);padding:10px;display:flex}
#planner,#mission{z-index:5}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,154,43,.6)}50%{box-shadow:0 0 0 6px rgba(243,154,43,0)}}
@media (prefers-reduced-motion: reduce){ .pulse{animation:none} }
.evbody{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-content:start}
.evcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.evlist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:8px}
.evlist li.locked{opacity:.6}
.evlist canvas{width:40px;height:40px;image-rendering:pixelated;flex-shrink:0}
.evmain{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:3px}
.evmain b{font-size:13.5px}
.evmain small{font-size:11.5px;color:var(--dim)}
.evmain small.why{color:var(--amber)}
.evbtns{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.evlist li > .btn{margin-left:auto}
.evbtns .btn,.evlist .btn{padding:6px 9px}
.rooms{display:flex;flex-wrap:wrap;gap:4px}
.room{font-family:var(--f-label);font-size:9.5px;padding:1px 5px;border-radius:2px;border:1px solid}
.room.ok{color:var(--ok);border-color:var(--ok)}
.room.no{color:var(--dim);border-color:var(--line);text-decoration:line-through}
.linkbtn{background:none;border:0;padding:0;color:var(--glass);text-decoration:underline;cursor:pointer;font:inherit}
.toast{z-index:6}
#planner:not([hidden]) ~ .toast,#evening:not([hidden]) ~ .toast{top:auto;bottom:18px;left:auto;right:18px}
.planner{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.ph h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px}
.pyday{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px}
.ychip{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:2px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ychip.bad{border-color:var(--hazard);color:#ffb3b5}
.pbody{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:10px}
.ptray{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;border-right:1px dashed var(--line)}
.tgrp{display:flex;flex-direction:column;gap:5px}
.tcard{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:6px 7px;cursor:grab;touch-action:none;user-select:none}

(() => {
'use strict';
// ---- 00-util.js
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* Gameplay randomness runs through one saveable stream, so a loaded run picks up
   exactly where it left off and a reported seed reproduces. Visuals use vrnd()
   instead: a window resize must never perturb the gameplay stream. */
let rngState = (Math.random() * 4294967296) >>> 0;
const seedRng = s => { rngState = s >>> 0; };
const rngSnapshot = () => rngState;
function rnd(){
  rngState = rngState + 0x6D2B79F5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const vrnd = Math.random;
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function gauss(){ let u = 0, v = 0; while(!u) u = rnd(); while(!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const f2 = v => v.toFixed(2);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry(1);
const rp = arr => arr[Math.floor(R() * arr.length)];
const rr = (a, b) => a + R() * (b - a);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---- 01-people.js
/* ================= people ================= */
const PEOPLE = {
  vasko:   {name:'Dr. Imre Vasko', role:'Xenobiology lead', bg:'#5a3220', skin:'#d9a27c', skinS:'#b37d5b', hair:'#4b4652', style:'messy', coat:'#e9e5ef', accent:'#f39a2b', stubble:true},
  okafor:  {name:'Dr. Adaeze Okafor', role:'Xenobiology lead', bg:'#16394a', skin:'#7a4a2f', skinS:'#5c3621', hair:'#1a1317', style:'puff', coat:'#e9e5ef', accent:'#62d6e3', glasses:true},
  bea:     {name:'Bea Thornton', role:'Lead lab tech', bg:'#3b381c', skin:'#eab795', skinS:'#c99474', hair:'#c3532b', style:'buzz', coat:'#7c8996', accent:'#f2d14a', freckles:true},
  pruitt:  {name:'Gerald Pruitt', role:'Station administrator', bg:'#2b2746', skin:'#f0c9a8', skinS:'#d1a885', hair:'#b9b3a9', style:'bald', coat:'#3c4a6b', accent:'#c43c3c', tie:true},

function drawPortrait(c, id, mood){
  const p = PEOPLE[id]; const f = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

// ---- 02-leads-techs.js
/* ================= leads, staff & techs ================= */
const LEADS = {
  vasko:  {id:'vasko', speed:1.5, risk:1.8, skip:0.45, pace:'Fast', protocol:'Loose', temper:'Maverick',
           blurb:'Brilliant, famous, and in a hurry. Spots patterns nobody else sees. Two of his landmark papers have never been replicated.'},
  okafor: {id:'okafor', speed:0.75, risk:0.7, skip:0, pace:'Slow', protocol:'Strict', temper:'Meticulous',
           blurb:'Careful to the point of exasperating. Catches confounds before they spread. Keeps her own copy of the notebook.'}
};

/* Four disciplines, scored 0 to 4. Work modes map onto the first three
   (handle, bench, observe); nerve is what holds when the work goes wrong. */
const STATS = {
  handling:{label:'Handling', blurb:'Hands-on work with live specimens. Steadier hands mean fewer incidents and fewer breaches.'},
  bench:{label:'Bench', blurb:'Precision work at the bench. Quicker, and less likely to hand you data you cannot trust.'},
  observe:{label:'Observation', blurb:'Patience at the glass. Quicker observation work, and catches confounds the lead would miss.'},
  nerve:{label:'Nerve', blurb:'Composure when containment fails. Nerve is what decides who walks out of the cell.'}
};
const STAT_KEYS = ['handling', 'bench', 'observe', 'nerve'];
const STAT_MAX = 4;
const MODE_STAT = {handle:'handling', bench:'bench', observe:'observe'};
/* Hours of relevant work behind each pip. Potential (cap) decides where a
   person stops improving, so a bad hire stays a bad hire and hiring matters. */
const XP_STEPS = [0, 8, 24, 52, 96];

/* Every trait gives something and costs something. Several also decide who a
   person can stand working under, which is what makes the lead choice bite. */
const TRAITS = {
  fasthands:{label:'Fast hands', good:'Works 15% faster', bad:'Causes incidents more often', work:0.85, risk:1.22, likes:'vasko'},
  bythebook:{label:'By the book', good:'Never skips decontamination', bad:'Works 12% slower', work:1.12, noskip:true, likes:'okafor', clashes:'vasko'},
  squeamish:{label:'Squeamish', good:'Unshakeable at the bench', bad:'Will not take hands-on work with live specimens', bench:1, refuse:'handle'},
  thorough:{label:'Thorough', good:'Rarely produces unreliable data', bad:'Works 10% slower', work:1.1, quality:0.4, likes:'okafor'},
  gloryhound:{label:'Glory hound', good:'Pushes work through fast under a lead who lets them', bad:'Cuts corners and clashes with careful supervision', work:0.9, risk:1.3, skip:1.6, likes:'vasko', clashes:'okafor'},
  steady:{label:'Steady', good:'Keeps their head when containment fails', bad:'Slow to pick up new disciplines', nerve:1, xp:0.6},
  green:{label:'Green', good:'Learns fast', bad:'Unreliable until they have the hours in', xp:1.8, quality:1.6, risk:1.15},
  veteran:{label:'Veteran', good:'Seen it before, and it shows under pressure', bad:'Will not be told how to do the job by a new lead', nerve:1, quality:0.7, clashes:'vasko'},
  careless:{label:'Careless', good:'Never slowed down by procedure', bad:'Skips decontamination and gets people hurt', work:0.92, skip:2.2, risk:1.25},
  insomniac:{label:'Insomniac', good:'No drop-off on overtime hours', bad:'Sluggish on the first hours of a shift', ot:true},
  quiet:{label:'Quiet', good:'Gets on with anyone', bad:'Never reports a near miss', mute:true},
  ambitious:{label:'Ambitious', good:'Improves quickly in every discipline', bad:'Morale falls fast when passed over for the risky work', xp:1.5, proud:true, likes:'vasko'}
};
const TRAIT_KEYS = Object.keys(TRAITS);

const TECH_NAMES = ['J. Alvarez', 'P. Nakamura', 'D. Osei', 'R. Kowalczyk', 'M. Haddad', 'L. Brennan', 'T. Iwu', 'S. Varga', 'K. Lindgren', 'A. Reyes', 'N. Petrov', 'F. Achebe', 'E. Moreau', 'H. Sato', 'O. Quist', 'B. Mensah', 'C. Oyelaran', 'V. Dubois', 'W. Ferreira', 'Y. Tanaka', 'Z. Abadi', 'G. Lindqvist', 'I. Duarte', 'Q. Mbeki'];
const TECH_LOOKS = [
  {skin:'#e8b896', hair:'#3a2a20'}, {skin:'#8a5a3a', hair:'#151012'}, {skin:'#c8956c', hair:'#2a2228'},
  {skin:'#f0caa8', hair:'#d8b25a'}, {skin:'#6e4430', hair:'#1a1416'}, {skin:'#d9a882', hair:'#7a3a22'}
];
const HUB_SPOTS = [[1.7, 3.2], [2.9, 1.3], [0.9, 1.3], [2.3, 3.5], [1.6, 1.2], [0.75, 2.75]];
const STRIDE = 8, LAB_CU = 9;
const LAB_SPOTS = [[7.15, 0.2], [10.85, 2.2], [7.6, 3.9], [10.85, 0.25]];
const BENCH_SPOTS = [[2.65, 3.05], [3.35, 2.5], [2.6, 3.6]];
const LANDING = [0.8, 2.0];
const BREACH_POS = [null, [7.6, 3.8], [5.0, 2.0], [2.5, 2.6], [0.8, 2.0]];
const BREACH_WHERE = ['', 'loose in the lab', 'in the spoke corridor', 'in the hub', 'at the shuttle bay, one transfer from the vessel'];

/* ---- roster helpers: pure reads over a staff record ---- */
const traitsOf = a => (a.traits || []).map(k => TRAITS[k]).filter(Boolean);
const traitMult = (a, key, dflt) => traitsOf(a).reduce((m, t) => m * (t[key] === undefined ? 1 : t[key]), dflt === undefined ? 1 : dflt);
const traitFlag = (a, key) => traitsOf(a).some(t => t[key]);
const refuses = (a, mode) => traitsOf(a).some(t => t.refuse === mode);
/* -1 under a lead they clash with, +1 under one they respect. */
function affinity(a, lead){
  const id = lead === undefined ? S.lead : lead;
  if(!id) return 0;
  let n = 0;
  for(const t of traitsOf(a)){ if(t.clashes === id) n--; if(t.likes === id) n++; }
  return clamp(n, -1, 1);
}
const moraleStep = a => a.morale >= 75 ? 1 : a.morale < 30 ? -1 : 0;
/* What a person is actually worth on today's shift, not on paper. */
function statOf(a, key){
  let v = (a.stats && a.stats[key]) || 0;
  v += traitsOf(a).reduce((n, t) => n + (t[key] || 0), 0);
  if(key !== 'nerve') v += affinity(a) + moraleStep(a);
  return clamp(v, 0, STAT_MAX);
}
const pips = n => '★'.repeat(n) + '☆'.repeat(STAT_MAX - n);
const staffName = a => a.name;
const roleLabel = a => a.role === 'tech' ? 'Lab tech' : (ROLES[a.role] ? ROLES[a.role].label : 'Staff');
const byId = id => S.techs.find(a => a.id === id) || null;

/* One discipline they are already good at, one they will never be. A specialist's
   strong discipline is the one their post is for, with a floor under it: nobody
   gets hired as a zoologist who cannot read an animal through the glass. */
function rollStats(role){
  const strong = ROLES[role] && ROLES[role].strong;
  const stats = {}, cap = {};
  const keys = STAT_KEYS.slice().sort(() => rnd() - .5);
  if(strong){ keys.splice(keys.indexOf(strong), 1); keys.unshift(strong); }
  keys.forEach((k, i) => {
    const ceiling = i === 0 ? 3 + Math.floor(rnd() * 2) : i === keys.length - 1 ? 1 + Math.floor(rnd() * 2) : 2 + Math.floor(rnd() * 2);
    cap[k] = clamp(ceiling, 1, STAT_MAX);
    const floor = k === strong ? 2 : 0;
    stats[k] = clamp(floor + Math.floor(rnd() * (cap[k] + 1 - floor)), 0, cap[k]);
  });
  return {stats, cap};
}
/* Studies run with hands on a live specimen. A role whose whole point is this
   work must never roll a trait that refuses it: a zoologist who will not handle
   animals is not a character quirk, it is a broken hire. */
const HANDS_ON_WORK = ['sample', 'clearance', 'stimulus', 'challenge'];
function traitAllowed(k, role){
  const t = TRAITS[k];
  if(!t.refuse) return true;
  const covers = (ROLES[role] && ROLES[role].covers) || [];
  if(t.refuse === 'handle' && covers.some(id => HANDS_ON_WORK.includes(id))) return false;
  return true;
}
function rollTraits(role){
  const pool = TRAIT_KEYS.filter(k => traitAllowed(k, role)).sort(() => rnd() - .5);
  const out = [pool[0]];
  if(rnd() < .55) for(const k of pool.slice(1)){
    /* Never pair two traits that pull the same lever in opposite directions. */
    const t = TRAITS[k], first = TRAITS[out[0]];
    if(t.refuse && first.refuse) continue;
    if(t.likes && first.clashes === t.likes) continue;
    if(t.clashes && first.likes === t.clashes) continue;
    out.push(k); break;
  }
  return out;
}

// ---- 02b-staff.js
/* ================= staff: roster, growth, morale, crewing ================= */
/* Sorts between 02-leads-techs (the tables) and 03-planets. Everything here
   operates on records held in S.techs, so it all saves without special cases. */
/* The roster opens general and narrows as the station grows. Lab techs,
   xenobiologists and zoologists can be hired from day one; every other
   discipline is unlocked by the lab that needs it, or by finding something that
   needs that kind of mind. `covers` is the work a role is the expert for: with
   the expert on the crew it goes faster and cleaner, and with nobody on station
   qualified it comes back unreliable more often. `gates` is work that simply is
   not on the table without them. */
const ROLES = {
  tech:{label:'Lab tech', tag:'Tech', general:true, hire:18, upkeep:0, strong:null, covers:[],
        blurb:'Runs the cells and the bench. Two are needed for anything hands-on, and they are who you lose first.'},
  xenobio:{label:'Xenobiologist', tag:'Xenobio', general:true, hire:34, upkeep:0.7, strong:'bench', covers:['sample', 'assay', 'biochem', 'extract'],
           blurb:'Tissue, toxins and what alien life is built from. The backbone of a dossier.'},
  zoologist:{label:'Zoologist', tag:'Zoology', general:true, hire:32, upkeep:0.7, strong:'observe', covers:['obs', 'habitat', 'clearance', 'stimulus'],
             blurb:'Reads animals through the glass. Scores behavior properly and knows when a specimen is about to go for someone.'},
  micro:{label:'Microbiologist', tag:'Micro', lab:'micro', hire:46, upkeep:0.8, strong:'bench', covers:['spread', 'revive', 'screen', 'vaccine'],
         blurb:'Cultures, pathogenicity and vaccine work. Microbe findings without one are guesses with a number attached.'},
  geneticist:{label:'Geneticist', tag:'Genetics', lab:'genetics', hire:50, upkeep:0.8, strong:'bench', covers:['genome', 'clone', 'crop'], gates:['hybrid'],
              blurb:'Sequencing, cloning lines and hybridization. Nobody else on station can run a hybridization at all.'},
  chemist:{label:'Chemist', tag:'Chem', lab:'chem', hire:46, upkeep:0.8, strong:'bench', covers:['synth', 'deriv'],
           blurb:'Synthesis routes and derivative searches. Turns a compound into something Meridian pays more for.'},
  physicist:{label:'Physicist', tag:'Physics', lab:'physics', hire:52, upkeep:0.9, strong:'bench', covers:['spectro', 'stress', 'battery', 'shield', 'horizon'],
             blurb:'Materials under load, bio-batteries and the horizon. The only one who knows what the exotic matter readings mean.'},
  engineer:{label:'Containment engineer', tag:'Engineer', lab:'containment2', hire:45, upkeep:0.8, strong:'handling', covers:['challenge'],
            blurb:'Seals, glazing and remote handling. Slows integrity loss across every built lab and finds faults before Calderon does.'},
  speech:{label:'Speech researcher', tag:'Speech', when:() => S.specs.some(s => s.flags.has('vocal')), hire:55, upkeep:0.9, strong:'observe', covers:['acoustic'], gates:['language'],
          blurb:'Finds structure in what a specimen says. Signal decoding is closed without one, and Meridian considers the post expendable.'},
  anthro:{label:'Xenoanthropologist', tag:'Anthro', when:() => S.specs.some(s => s.flags.has('ruins') || s.flags.has('tools') || s.truth.sapience >= 3) || S.planets.some(p => p.missions > 0 && p.ruins), hire:60, upkeep:1.0, strong:'observe', covers:['age', 'language'],
          blurb:'Ruins, tools and the question of personhood. The only person here qualified to put a sapience finding in front of Meridian.'}
};
const ROLE_KEYS = Object.keys(ROLES);
const SPECIALIST_KEYS = ROLE_KEYS.filter(k => k !== 'tech');
/* Containment engineers come with the second cell, where handling rigs start to matter. */
const labBuilt = t => S.labs.some(L => L.built && L.type === t);
/* A discipline opens as soon as its lab is RESEARCH-unlocked, not once the lab
   stands. It has to be this way round: building a lab needs its head hired, so
   gating the hire on the finished building would deadlock the pair and strand
   every specialty lab for the rest of the run. You hire the geneticist, then
   they build you the Genetics Lab. */
const labOpenFor = t => S.labs.some(L => L.type === t && (L.built || L.building || labUnlocked(L.k)));
function roleOpen(key){
  const R = ROLES[key];
  if(!R) return false;
  if(R.general) return true;
  if(R.lab === 'containment2') return S.labs.filter(L => L.built && L.type === 'containment').length >= 2 || (labBuilt('containment') && S.labs.some(L => L.type === 'containment' && !L.built && labUnlocked(L.k)));
  if(R.lab) return labOpenFor(R.lab);
  return R.when ? !!R.when() : true;
}
const openRoles = () => ROLE_KEYS.filter(roleOpen);
/* Who, if anyone, is the expert for a piece of work. */
function expertRole(id){ return ROLE_KEYS.find(k => (ROLES[k].covers || []).includes(id)) || null; }
function gateRole(id){ return ROLE_KEYS.find(k => (ROLES[k].gates || []).includes(id)) || null; }
/* Work that needs a discipline nobody on station has. Returns the role, or null. */
function gatedBy(id){ const k = gateRole(id); return k && !hasSpecialist(k) ? k : null; }
function expertOnStation(id){ const k = expertRole(id); return k && hasSpecialist(k) ? k : null; }
function missingExpert(id){ const k = expertRole(id); return k && k !== 'tech' && !hasSpecialist(k) ? k : null; }

let staffSeq = 0;
function makeStaff(role, opts = {}){
  const R = ROLES[role] || ROLES.tech;
  const taken = new Set([...S.usedNames, ...(S.candidates || []).map(c => c.name)]);
  const name = opts.name || TECH_NAMES.find(n => !taken.has(n)) || (R.tag + ' ' + (S.techs.length + 1 + taken.size));
  if(opts.reserve !== false) S.usedNames.add(name);
  const {stats, cap} = rollStats(role);
  const home = HUB_SPOTS[S.techs.length % HUB_SPOTS.length];
  const lk = pick(TECH_LOOKS);
  return {
    id:'p' + (++staffSeq), kind:'tech', role, name, alive:true, injured:false, away:false,
    stats, cap, xp:{handling:0, bench:0, observe:0, nerve:0}, traits:rollTraits(role), morale:62 + Math.floor(rnd() * 16),
    hours:0, since:S ? S.t : 0, grumbled:0,
    u:home[0], v:home[1], path:[], wait:0, inLab:false, labK:0, task:'idle', flash:0,
    look:{skin:lk.skin, hair:lk.hair, coat:R.coat, accent:R.accent}, home, spot:0
  };
}
/* ---- lab heads ----
   Every lab is run by someone qualified. Containment cells are a xenobiology
   post; each specialty lab is headed by its own discipline. A built lab with
   nobody at its head still runs, but slowly and with data you cannot bank. */
const LAB_HEAD_ROLE = {containment:'xenobio', micro:'micro', genetics:'geneticist', chem:'chemist', physics:'physicist'};
const headRoleFor = L => LAB_HEAD_ROLE[L.type] || 'xenobio';
const headOf = L => L && L.head ? byId(L.head) : null;
const headIsFit = a => !!(a && a.alive && !a.away);
const labHeaded = L => headIsFit(headOf(L));
const labOfHead = a => S.labs.find(L => L.built && L.head === a.id) || null;
/* Qualified people not already running a lab. */
function freeHeads(role){
  return S.techs.filter(a => a.alive && !a.away && a.role === role && !S.labs.some(L => L.built && L.head === a.id));
}
function assignHead(L){
  if(labHeaded(L)) return headOf(L);
  const a = freeHeads(headRoleFor(L))[0];
  if(!a) { L.head = null; return null; }
  L.head = a.id;
  return a;
}
/* Called whenever the roster or the labs change under us. */
function reseatHeads(){
  for(const L of S.labs){
    if(!L.built){ L.head = null; continue; }
    if(!headIsFit(headOf(L))) L.head = null;
  }
  for(const L of S.labs) if(L.built && !L.head) assignHead(L);
}
const specialists = () => S.techs.filter(a => a.alive && a.role !== 'tech');
const specialistOn = role => S.techs.find(a => a.alive && !a.away && !a.injured && a.role === role) || null;
const hasSpecialist = role => !!specialistOn(role);

/* ---- growth ---- */
const statFromXp = (a, key) => { let n = 0; while(n < STAT_MAX && a.xp[key] >= XP_STEPS[n + 1]) n++; return Math.min(n, a.cap[key]); };
function awardXp(a, key, hours){
  if(!a || !a.alive || !key) return;
  a.xp[key] = (a.xp[key] || 0) + hours * traitMult(a, 'xp');
  a.hours = (a.hours || 0) + hours;
  const was = a.stats[key] || 0, now = Math.max(was, statFromXp(a, key));
  if(now > was){
    a.stats[key] = now;
    log('bea', 'note', `${a.name} is rated ${now} of ${STAT_MAX} on ${STATS[key].label.toLowerCase()} now. The hours show.`);
    if(now >= 3 && was < 3) notify('bea', `${a.name} has got good at ${STATS[key].label.toLowerCase()}. Worth putting on the work that needs it.`, 'note');
  }
}
/* Surviving a breach marks people. Nerve is the one stat that can fall. */
function scar(a, why){
  if(!a || !a.alive || traitFlag(a, 'nerve')) return;
  if(a.stats.nerve <= 0) return;
  a.stats.nerve--; a.xp.nerve = XP_STEPS[a.stats.nerve] || 0;
  a.morale = clamp(a.morale - 18, 0, 100);
  log('bea', 'warning', `${a.name} came out of ${why} shaken. Their nerve is not what it was.`);
}

/* ---- morale and friction with the lead ---- */
function staffDayTick(){
  for(const a of S.techs){
    if(!a.alive) continue;
    const aff = affinity(a);
    let d = aff * 6 - 1;
    if(a.injured) d -= 4;
    if(S.hazardPay) d += 2;
    if(S.slowdown) d += 1;
    if(traitFlag(a, 'proud') && !a.workedRecently) d -= 3;
    a.workedRecently = false;
    a.morale = clamp(a.morale + d, 0, 100);
  }
}
/* Bea raises it once per person, when it is bad enough to act on. */
function reportFriction(){
  if(!S.lead || S.breach) return;
  const sore = S.techs.filter(a => a.alive && !a.away && a.morale < 28 && affinity(a) < 0 && !a.grumbled);
  if(!sore.length) return;
  const a = pick(sore); a.grumbled = 1;
  const t = traitsOf(a).find(x => x.clashes === S.lead);
  say('bea', 'uneasy', `${a.name} wants off ${PEOPLE[S.lead].name}'s rotation. ${t ? t.bad + '.' : 'They are not getting on.'} I can move them to bench work only, or you can leave it and risk losing them.`, {kind:'warning', choices:[
    {label:'Keep them off hands-on work', act:() => { a.benchOnly = true; a.morale = clamp(a.morale + 22, 0, 100); log('bea', 'admin', `${a.name} moved to bench and observation work only.`); }},
    {label:'They work where they are needed', act:() => { a.morale = clamp(a.morale - 10, 0, 100); log('bea', 'admin', `${a.name} kept on full rotation over their objection.`); }}
  ]});
}
function staffQuit(a){
  a.alive = false; a.quit = true;
  reseatHeads();
  say('bea', 'numb', `${a.name} took the shuttle. Their words were that they would rather be unemployed than work another breach under ${S.lead ? PEOPLE[S.lead].name : 'this administration'}.`, {kind:'warning'});
  launchShuttle();
  S.dirty = true;
}
function checkWalkouts(){
  for(const a of S.techs.filter(x => x.alive && !x.away && x.morale <= 0)) staffQuit(a);
}

/* ---- crewing ----
   Auto-assign picks the best available person for the discipline the work needs,
   so a hands-off player gets sensible crews; a named crew on the item always wins. */
/* ignoreBusy is what keeps the planner still: an estimate asks who could do this
   work at all, not who happens to be free this second, so a queued block's hours
   stop drifting every time another item picks up a crew. */
function eligible(a, mode, ignoreBusy){
  if(!a.alive || a.away || a.injured) return false;
  if(!ignoreBusy && a.job) return false;
  if(refuses(a, mode)) return false;
  if(a.benchOnly && mode === 'handle') return false;
  return true;
}
function crewScore(a, mode, id){
  const key = MODE_STAT[mode] || 'bench';
  let s = statOf(a, key) * 10 + statOf(a, 'nerve') * 2 + a.morale / 50;
  /* Having the right discipline outranks raw pips, so the geneticist gets the
     genome work without being told and a hire stays legible. Skill is the
     tiebreaker among equals, and specialists are kept off work that is not
     theirs so they are free when it is. */
  if(id && (ROLES[a.role].covers || []).includes(id)) s += 100;
  else if(a.role !== 'tech') s -= 4;
  return s;
}
function pickCrew(mode, need, o = {}){
  const pool = S.techs.filter(a => eligible(a, mode, o.ignoreBusy) && !(o.exclude || []).includes(a.id));
  return pool.sort((x, y) => crewScore(y, mode, o.id) - crewScore(x, mode, o.id)).slice(0, need);
}
const crewNeed = mode => mode === 'handle' ? 2 : 1;
const crewOf = it => (it.crewIds || []).map(byId).filter(a => a && a.alive);
/* Who would take this work. A crew the player named always wins. */
function projectCrew(w, mode){
  const m = mode || w.mode || wMode(w);
  const named = crewOf(w);
  if(named.length) return named;
  return pickCrew(m, crewNeed(m), {ignoreBusy:true, id:w.type});
}
/* How a crew bends the work: 0 pips is slow and sloppy, 4 is fast and clean.
   On top of raw skill, having the right discipline on the job matters, and
   having nobody on station who understands the work matters more. */
function crewFactors(crew, mode, id){
  const key = MODE_STAT[mode] || 'bench';
  let work = 1, risk = 1, quality = 1, nerve = 0;
  if(crew.length){
    const avg = crew.reduce((n, a) => n + statOf(a, key), 0) / crew.length;
    nerve = crew.reduce((n, a) => n + statOf(a, 'nerve'), 0) / crew.length;
    for(const a of crew){ work *= traitMult(a, 'work'); risk *= traitMult(a, 'risk'); quality *= traitMult(a, 'quality'); }
    work *= 1.18 - avg * 0.09;
    risk *= 1.3 - avg * 0.12;
    quality *= 1.5 - avg * 0.22;
    if(id && crew.some(a => (ROLES[a.role].covers || []).includes(id))){ work *= 0.85; quality *= 0.5; risk *= 0.85; }
  }
  if(id && missingExpert(id)) quality *= 1.55;
  return {work:clamp(work, 0.55, 1.6), risk:clamp(risk, 0.45, 1.8), quality:clamp(quality, 0.2, 2.4), nerve};
}
function workCrewFactors(w, mode){
  const m = mode || w.mode || wMode(w);
  return crewFactors(projectCrew(w, m), m, w.type);
}

/* What Pruitt adds after the paperwork, which is where he lives. */
const HIRE_NOTE = {
  tech:'They asked what the hazard pay arrangement is. I said I would look into it.',
  xenobio:'Meridian attached a note calling the posting "an unrivalled opportunity". I have not forwarded it.',
  zoologist:'They asked whether the specimens have names. I said the director names them. They seemed pleased, which surprised me.',
  micro:'They have asked for their own autoclave and a door that locks from inside. Both reasonable, apparently.',
  geneticist:'They read the hybridization policy on the shuttle and had questions. Meridian does not have a hybridization policy.',
  chemist:'They want the extraction logs going back to the first specimen. All of them. Tonight.',
  physicist:'They spent the approach staring out of the port at the horizon and did not unpack. I think that is enthusiasm.',
  engineer:'First thing they did was put a hand on Lab A and say "hm". I have not slept properly since.',
  speech:'They asked what happens if the answer is yes. I did not have an answer prepared.',
  anthro:'They asked to see the ruins survey before they saw their quarters.'
};
/* ---- hiring ----
   Meridian keeps a short list in front of you, weighted to the posts the station
   does not have filled. Candidates expire when their post closes. */
const HIRE_EVERY = 48, CANDIDATES = 3;
function refreshCandidates(){
  S.candidates = (S.candidates || []).filter(c => roleOpen(c.role));
  if(S.t < (S.nextCandidate || 0) && S.candidates.length >= CANDIDATES) return;
  S.nextCandidate = S.t + HIRE_EVERY;
  const roles = openRoles();
  const want = roles.filter(k => k !== 'tech' && !hasSpecialist(k));
  let guard = 0;
  while(S.candidates.length < CANDIDATES && guard++ < 12){
    const role = want.length && rnd() < 0.7 ? pick(want) : pick(roles);
    if(S.candidates.some(c => c.role === role) && guard < 8) continue;
    S.candidates.push(makeStaff(role, {reserve:false}));
  }
}
function hireBlock(c){
  if(!c) return 'Nobody by that name.';
  if(S.breach) return 'Deal with the breach first.';
  if(!canDecide()) return 'Hiring is approved at the end of the shift.';
  if(!roleOpen(c.role)) return 'That post is not open yet.';
  return '';
}
function hireStaff(id){
  const i = (S.candidates || []).findIndex(c => c.id === id);
  if(i < 0) return;
  const c = S.candidates[i], why = hireBlock(c);
  if(why){ notify('pruitt', why, 'admin'); return; }
  const R = ROLES[c.role];
  S.funds -= R.hire;
  S.candidates.splice(i, 1);
  S.usedNames.add(c.name);
  c.since = S.t;
  maybePlant(c);
  c.home = HUB_SPOTS[S.techs.length % HUB_SPOTS.length];
  c.u = LANDING[0]; c.v = LANDING[1]; c.path = [{u:c.home[0], v:c.home[1]}];
  S.techs.push(c);
  reseatHeads();
  launchShuttle();
  log('pruitt', 'admin', `${c.name} hired as ${R.label.toLowerCase()}: ${R.hire} cr${R.upkeep ? `, ${R.upkeep} cr/day` : ''}.`);
  notify('pruitt', `${c.name} is on the next shuttle. ${R.label}.${R.upkeep ? ` Salary runs ${R.upkeep} cr a day from now on.` : ''}${HIRE_NOTE[c.role] ? ' ' + HIRE_NOTE[c.role] : ''}`);
  S.dirty = true;
}

// ---- 02c-dynamics.js
/* ================= people problems between lab heads =================
   Two labs of the same type means two people with the same training, the same
   ambitions and one director's attention between them. That is where the station
   stops being a spreadsheet. Each same-discipline pair carries tension and a
   bond; traits decide which one grows. Nothing here is a relationship screen,
   it surfaces as incidents at the evening briefing. */
const PAIR_FLASH = 28;   /* tension that starts an authorship fight */
const PAIR_BURN = 64;    /* tension that turns into sabotage */
const PAIR_BOND = 58;    /* warmth that becomes an attachment */

const pairKey = (a, b) => [a, b].sort().join('|');
/* Heads who share a discipline, and so share a problem. */
function headPairs(){
  const out = [], byType = {};
  for(const L of S.labs){
    if(!L.built || !labHeaded(L)) continue;
    (byType[L.type] = byType[L.type] || []).push(L);
  }
  for(const t in byType){
    const ls = byType[t];
    for(let i = 0; i < ls.length; i++) for(let j = i + 1; j < ls.length; j++)
      out.push({a:ls[i].head, b:ls[j].head, labA:ls[i], labB:ls[j], type:t});
  }
  return out;
}
function bondOf(p){
  const k = pairKey(p.a, p.b);
  S.bonds = S.bonds || {};
  if(!S.bonds[k]) S.bonds[k] = {a:p.a, b:p.b, tension:0, bond:0, state:'', since:S.t, told:0};
  return S.bonds[k];
}
/* Which way a pairing drifts is written in who they are. */
function pairDrift(A, B){
  let t = 0.6, w = 0.4;
  for(const x of [A, B]){
    if(traitFlag(x, 'proud')) t += 1.3;              /* ambitious */
    if(traitsOf(x).some(y => y.label === 'Glory hound')) t += 1.6;
    if(traitsOf(x).some(y => y.label === 'Veteran')) t += 0.5;
    if(traitsOf(x).some(y => y.label === 'By the book')) t += 0.4;
    if(traitsOf(x).some(y => y.label === 'Quiet')) { t -= 0.7; w += 0.7; }
    if(traitsOf(x).some(y => y.label === 'Steady')) { t -= 0.5; w += 0.5; }
    if(x.morale < 35) t += 0.8;
    if(x.morale > 75) w += 0.5;
  }
  /* Two people who both want the same credit get on worst of all. */
  if(traitFlag(A, 'proud') && traitFlag(B, 'proud')) t += 1.2;
  return {t:Math.max(0, t), w:Math.max(0, w)};
}
function dynamicsDayTick(){
  S.bonds = S.bonds || {};
  const live = {};
  for(const p of headPairs()){
    const A = byId(p.a), B = byId(p.b);
    if(!A || !B) continue;
    const st = bondOf(p), d = pairDrift(A, B);
    live[pairKey(p.a, p.b)] = true;
    st.tension = clamp(st.tension + d.t - (st.state === 'attached' ? 1.5 : 0), 0, 100);
    st.bond = clamp(st.bond + d.w - (st.state === 'feud' ? 1.2 : 0), 0, 100);
    if(st.state === 'attached'){ A.morale = clamp(A.morale + 2, 0, 100); B.morale = clamp(B.morale + 2, 0, 100); }
  }
  /* A pairing that no longer exists (a death, a rebuild) stops mattering. */
  for(const k in S.bonds) if(!live[k] && S.bonds[k].state !== 'spy') delete S.bonds[k];
}
/* One people problem per briefing at most. The station has enough going on. */
function dynamicsBriefing(){
  if(S.breach || S.over) return;
  const ps = headPairs();
  if(!ps.length) return;
  for(const p of ps){
    const A = byId(p.a), B = byId(p.b);
    if(!A || !B) continue;
    const st = bondOf(p);
    if(S.t - st.told < 48) continue;
    if(A.spy || B.spy){ if(spyEvent(p, A.spy ? A : B, A.spy ? B : A, st)) return; }
    if(st.tension >= PAIR_BURN && st.state !== 'feud'){ feudEvent(p, A, B, st); return; }
    if(st.tension >= PAIR_FLASH && !st.told){ authorshipEvent(p, A, B, st); return; }
    if(st.bond >= PAIR_BOND && st.state !== 'attached'){ attachEvent(p, A, B, st); return; }
  }
}
const markTold = st => { st.told = S.t; };

/* Two heads, one discipline, one paper. Somebody's name goes first. */
function authorshipEvent(p, A, B, st){
  markTold(st);
  const disc = LAB_TYPES[p.type].label.toLowerCase();
  say('pruitt', 'uneasy', `${A.name} and ${B.name} have both been to see me, separately, about whose name leads on the ${disc} work. Neither of them mentioned that the other one had been in. I would like a decision, Director, before this becomes a thing I am managing instead of a station.`, {kind:'warning', choices:[
    {label:`${A.name} leads`, act:() => creditTo(A, B, st)},
    {label:`${B.name} leads`, act:() => creditTo(B, A, st)},
    {label:'Joint credit, no lead author', act:() => {
      st.tension = clamp(st.tension - 14, 0, 100);
      A.morale = clamp(A.morale - 5, 0, 100); B.morale = clamp(B.morale - 5, 0, 100);
      log('pruitt', 'admin', `Joint credit on the ${disc} work. Both of them said that was fine in a tone that indicated it was not fine. That is usually how I know a call was fair.`);
    }}
  ]});
}
function creditTo(win, lose, st){
  st.tension = clamp(st.tension + 18, 0, 100);
  win.morale = clamp(win.morale + 16, 0, 100);
  lose.morale = clamp(lose.morale - 18, 0, 100);
  log('pruitt', 'admin', `${win.name} named lead author over ${lose.name}.`);
  if(lose.morale < 25) notify('bea', `${lose.name} said congratulations and then recalibrated a scale that did not need recalibrating for forty minutes. Watch them.`, 'warning');
}

/* Tension with nowhere to go turns into damage. */
function feudEvent(p, A, B, st){
  markTold(st); st.state = 'feud';
  const spiteful = traitFlag(A, 'proud') || traitsOf(A).some(y => y.label === 'Glory hound') ? A : B;
  const victim = spiteful === A ? B : A;
  const lab = labOfHead(victim);
  say('bea', 'angry', `I am going to say this once. ${spiteful.name} has been in ${lab ? lab.name : "the other lab"} out of hours, and ${victim.name}'s last run did not fail by itself. This is past professional now.`, {kind:'warning', choices:[
    {label:`Move ${spiteful.name} off the rotation for a week`, act:() => {
      spiteful.benchOnly = true; spiteful.morale = clamp(spiteful.morale - 10, 0, 100);
      st.tension = clamp(st.tension - 40, 0, 100); st.state = '';
      log('pruitt', 'admin', `${spiteful.name} pulled off full rotation after the ${lab ? lab.name : 'lab'} business.`);
    }},
    {label:`Dismiss ${spiteful.name}`, act:() => {
      dismiss(spiteful, 'dismissed after sabotaging a colleague');
      st.tension = 0; st.state = '';
      standing(-3);
    }},
    {label:'Say nothing and let them work it out', act:() => {
      log('pruitt', 'admin', 'Director declined to act on the sabotage report.');
      sabotage(victim, spiteful);
    }}
  ]});
}
/* Quiet damage: a failing seal, a run that comes back wrong. */
function sabotage(victim, by){
  const lab = labOfHead(victim);
  if(lab){ lab.integrity = Math.max(0, lab.integrity - 14); lab.fault = true; }
  victim.morale = clamp(victim.morale - 12, 0, 100);
  for(const it of S.items.filter(x => lab && x.lane === 'L' + lab.k && x.state === 'running')) it.rushed = true;
  log('ops', 'warning', `${lab ? lab.name : 'A lab'} lost integrity overnight. Nobody filed a reason.`);
}

/* Two people who hold each other up, and cover for each other. */
function attachEvent(p, A, B, st){
  markTold(st); st.state = 'attached';
  A.morale = clamp(A.morale + 12, 0, 100); B.morale = clamp(B.morale + 12, 0, 100);
  say('bea', 'neutral', `${A.name} and ${B.name} have got close. I am not here to police it, the hub has six chairs and nobody has gone home in a year. They work better for it. You should know it means they will cover for each other, including the near misses, and that if anything happens to one of them you will lose the other too.`, {kind:'note', choices:[
    {label:'Leave them to it', act:() => { log('bea', 'admin', `${A.name} and ${B.name} noted as attached. Morale is up in both labs and I am not putting the reason in the log.`); }},
    {label:'Separate their rotations', act:() => {
      st.state = ''; st.bond = clamp(st.bond - 30, 0, 100);
      A.morale = clamp(A.morale - 14, 0, 100); B.morale = clamp(B.morale - 14, 0, 100);
      log('pruitt', 'admin', `${A.name} and ${B.name} moved onto separate rotations at the director's instruction.`);
    }}
  ]});
}
/* Someone else is paying them. */
function spyEvent(p, spy, other, st){
  if(!spy.spy || spy.spyKnown) return false;
  markTold(st); spy.spyKnown = true; st.state = 'spy';
  const who = spy.spyFor || 'a partner lab';
  say('calderon', 'alarmed', `Audit finding, Director. ${spy.name} has been copying ${other.name}'s raw data off station, to ${who}. They were placed here to do it. I want it on record that I found this during a routine check of the transfer logs, which is the kind of check people tell me is a waste of everyone's time.`, {kind:'warning', choices:[
    {label:`Dismiss ${spy.name}`, act:() => { dismiss(spy, `dismissed for passing data to ${who}`); standing(2); }},
    {label:'Leave them in place and feed them bad numbers', act:() => {
      spy.fedFalse = true;
      log('calderon', 'admin', `${spy.name} left in place and fed falsified figures.`);
      say('okafor', 'uneasy', "We are now knowingly putting wrong numbers into somebody else's hands. Whatever they build on them is on us too.", {kind:'warning'});
    }},
    {label:'Do nothing', act:() => { standing(-5); log('pruitt', 'admin', `Director took no action on ${spy.name}.`); }}
  ]});
  return true;
}
function dismiss(a, why){
  a.alive = false; a.quit = true; a.dismissed = true;
  reseatHeads();
  log('pruitt', 'admin', `${a.name} ${why}.`);
  notify('pruitt', `${a.name} is off the station on the next shuttle.`);
  launchShuttle();
  S.dirty = true;
}
/* A spy is placed, not grown: the chance exists only once the station has
   something worth stealing and a second lab of the same kind to steal it from. */
function maybePlant(a){
  if(a.role === 'tech' || !S.specs.some(s => s.paperV > 0)) return;
  if(rnd() < 0.12){ a.spy = true; a.spyFor = pick(['Kepler Deep Lab', 'Halden Station', 'Vireo Biolabs', 'the Directorate']); }
}

const SYL1 = ['Ves', 'Kor', 'Thal', 'Ira', 'Mor', 'Sel', 'Quen', 'Dar', 'Oph', 'Lyr', 'Cal', 'Nem', 'Tor', 'Ash', 'Bel'];
const SYL2 = ['a', 'is', 'on', 'eth', 'ux', 'ora', 'ine', 'ar', 'el', 'yr'];
function genPlanets(seed){
  R = mulberry(seed);
  const keys = Object.keys(ARCH).sort(() => R() - .5);
  const starters = keys.filter(k => ['garden', 'botanical', 'cryo', 'ice'].includes(k));
  const first = starters[0];
  const rest = keys.filter(k => k !== first);
  const chosen = [first, ...rest.slice(0, 4)];
  if(!chosen.includes('barren') && R() < .6) chosen[4] = 'barren';
  const used = new Set();
  const planets = chosen.map((arch, i) => {
    const A = ARCH[arch];
    let sys; do { sys = rp(SYL1) + rp(SYL2); } while(used.has(sys)); used.add(sys);
    const star = rp(A.star), atmK = rp(A.atm), mass = +rr(A.mass[0], A.mass[1]).toFixed(2);
    const temp = Math.round(rr(A.temp[0], A.temp[1])), pres = +rr(A.pres[0], A.pres[1]).toFixed(pres => pres);
    const g = +(Math.pow(mass, 0.46)).toFixed(2);
    const tidal = star === 'M' && R() < .7;
    const magnet = mass > .8 && R() < .85;
    const T = temp + 273;
    let sound = ATM[atmK].sound ? Math.round(ATM[atmK].sound * Math.sqrt(Math.max(T, 60) / 273)) : 0;
    if(arch === 'barren') sound = Math.round(sound * .6);
    let biochem = 'carbon-water';
    if(arch === 'cryo') biochem = 'methane';
    else if(arch === 'hostile') biochem = R() < .35 ? 'silicon' : (atmK === 'sulfur' ? 'sulfur' : 'carbon-water');
    else if(arch === 'cloud' && atmK === 'h2') biochem = 'ammonia';
    return {
      i, arch, sys, name:`${sys} ${'bcdef'[Math.floor(R() * 4)]}`, nick:rp(A.nick), star, atm:atmK, mass, g, temp, pres:+pres.toFixed(pres < 0.1 ? 3 : 1), tidal, magnet, sound, biochem,
      hazard:A.hazard, dist:Math.round(rr(26, 54)), known:i < 3, missions:0, link:null, sapient:false, ruins:false, recovered:0,
      look:{seed:Math.floor(R() * 1e6), ring:arch === 'cloud' ? R() < .6 : R() < .12}
    };
  });

/* ================= storage =================

   have to be captured alongside it: the id counters, the gameplay RNG position,
   the lead scientists (LEADS holds their pulls, quit flag and walking actor) and
   the loose world objects C (the escaped specimen) and shuttle.

   zero on load and the next thing minted collides with something that already
   exists, which silently rebinds crews, lab heads and relationships. Adding a
   new `let xSeq` means adding it here, and the save test checks for exactly this.

   Encoding is generic on purpose. S grows every time the game does, so a
   field-by-field writer would rot; instead everything reachable is walked, Sets

   fails loudly in the smoke tests rather than silently writing a broken save. */

  if(t === 'function') throw new Error(`cannot save a function at ${path}`);
  if(t !== 'object') throw new Error(`cannot save a ${t} at ${path}`);
  if(v instanceof Set) return {$set:[...v].map((x, i) => encode(x, `${path}<set ${i}>`))};
  if(Array.isArray(v)) return v.map((x, i) => encode(x, `${path}[${i}]`));
  if(v.nodeType || v === window || v instanceof Date) throw new Error(`cannot save a host object at ${path}`);

/* ================= shuttle & mission craft ================= */
/* The shuttle carries a job tag rather than a callback, so a run can be saved
   mid-flight. Anything the shuttle does on arrival lives in SHUTTLE_JOBS. */
const shuttle = {active:false, p:0, leg:0, job:null, queue:[]};
const SHUTTLE_JOBS = {
  tech(){ if(S.over) return; const a = addTech(true); notify('ops', `Replacement tech ${a.name} arrived by shuttle.`); S.dirty = true; }
};
function launchShuttle(job){
  if(shuttle.active){ shuttle.queue.push(job || null); return; }
  shuttle.active = true; shuttle.p = 0; shuttle.leg = 0; shuttle.job = job || null;
}
function stepShuttle(dt){
  if(S.flight){ S.flight.p += dt / 3; if(S.flight.p >= 1) S.flight = null; }
  if(!shuttle.active) return;
  shuttle.p += dt / 2.2 * (S.speed >= 3 ? 2 : 1);
  if(shuttle.p >= 1){
    shuttle.p = 0;
    if(shuttle.leg === 0) shuttle.leg = 1;
    else {
      shuttle.active = false; const job = shuttle.job; shuttle.job = null;
      if(job && SHUTTLE_JOBS[job]) SHUTTLE_JOBS[job]();
      if(shuttle.queue.length) launchShuttle(shuttle.queue.shift());
    }
  }
}

/* ================= economy ================= */
function staffUpkeep(){ return S.techs.reduce((n, a) => n + (a.alive ? (ROLES[a.role] ? ROLES[a.role].upkeep : 0) : 0), 0) / 24; }
function upkeepPerHour(){ const b = S.labs.filter(L => L.built); return 0.15 + b.length * 0.08 + b.filter(L => L.bsl >= 3).length * 0.12 + (S.hazardPay ? 0.1 : 0) + 0.02 * S.specs.filter(s => s.alive && s.loc === 'hold').length + staffUpkeep(); }
function standing(d){ S.standing = clamp(S.standing + d, 0, 100); }
/* Budget model: this is an R&D station, not a business. Meridian funds the work
   up front and the director's job is the science, so nothing here is ever refused
   for lack of credits. Spending past the grant puts the station over budget, which
   is an administrative problem with administrative consequences: Pruitt files it,
   Meridian's confidence drops, and a program that stays over budget long enough
   gets cancelled. The science never stops for want of money. */
const overBudget = () => S.funds < 0;
const deficit = () => Math.max(0, -S.funds);
/* Would committing this much put the station over, or deeper over? */
const wouldOverrun = cost => S.funds - cost < 0;
const budgetTag = cost => wouldOverrun(cost) ? (overBudget() ? 'deepens the overrun' : 'goes over budget') : '';
/* Confidence lost per day while the books are red, scaled to how red. */
const overBudgetBleed = () => clamp(1 + deficit() / 70, 1, 6);
function budgetDayTick(){
  if(!overBudget()){ S.overRun = 0; return; }
  S.overDays = (S.overDays || 0) + 1;
  S.overRun = (S.overRun || 0) + 1;
  S.overPeak = Math.max(S.overPeak || 0, deficit());
  standing(-overBudgetBleed());
  const d = Math.round(deficit());
  if(S.overRun === 1) notify('pruitt', `We are over budget, ${d} cr in the red. Nothing stops. I want to be clear that nothing stopping is the policy and not an oversight, because I will be asked.`, 'warning');
  else if(S.overRun === 4) say('pruitt', 'uneasy', `Fourth day in the red, ${d} cr down. The work carries on, Director, that is the whole point of the place. But there is a column on a sheet in an office you will never visit, and it is going the wrong way, and eventually a person reads that column instead of the papers.`, {kind:'warning'});
  else if(S.overRun === 9) say('pruitt', 'numb', `Finance want a recovery plan. I have written "publish" and left the rest of the page blank. They will accept it, because the alternative is reading it.`, {kind:'warning'});
  else if(S.overRun % 7 === 0) notify('pruitt', `${S.overRun} days over budget, ${d} cr down. Standing is paying for it, as standing does.`, 'warning');
}
function renewalFor(t){ return Math.round(GRANT_RENEW[t] * clamp(S.standing / 60, 0.4, 1.3)); }

// ---- 14-risk.js
/* ================= risk ================= */
const MITIGATE = {
  none:{label:'Skip', costM:1, workM:1, riskM:1.6, breachM:1.3, desc:'No extra precautions. Faster and cheaper, and a lot more likely to go wrong.'},
  std:{label:'Standard', costM:1.25, workM:1.2, riskM:1, breachM:1, desc:'Restraint frame, a second spotter, double-gloved transfers.'},
  full:{label:'Full', costM:1.6, workM:1.5, riskM:0.45, breachM:0.6, desc:'Remote handling arms, a sealed transfer box, and a medic on standby.'}
};
const RISK_BASE = {sample:.3, stimulus:.42, challenge:.5, revive:.45, assay:.28};
const riskBase = id => RISK_BASE[id] || .3;
const mitOf = o => MITIGATE[(o && o.mit) || 'std'] || MITIGATE.std;
function studyCost(sp, id, o){ const c = STUDIES[id].cost(sp, o); return isTrigger(sp, id) ? Math.round(c * mitOf(o).costM) : c; }
function studyWork(sp, id, o){ const w = STUDIES[id].work(sp, o); return isTrigger(sp, id) ? Math.round(w * mitOf(o).workM) : w; }
function riskFactors(sp, id){
  const f = [], L = labOf(sp) || S.labs[0];
  if(!valid(sp, 'assay')) f.push(['Hazards not yet assayed', 1.15]);
  else if(sp.truth.lethal) f.push(['Lethal to people', 1.35]);
  else if(sp.truth.hazard === 'none') f.push(['No toxins or pathogens found', 0.7]);
  if(ANIMAL(sp) && valid(sp, 'obs')){ if(sp.find.obs.stance === 'danger') f.push(['Aggressive', 1.3]); else if(/Docile/.test(sp.find.obs.text)) f.push(['Docile', 0.8]); }
  if(ANIMAL(sp) && !valid(sp, 'obs')) f.push(['Behavior unknown', 1.1]);
  if(valid(sp, 'habitat') && sp.truth.sensitive && !L.envMatched) f.push(['Habitat not matched, specimen stressed', 1.2]);
  if(claimFor(sp, 'containment') && L.bsl < sp.truth.bsl) f.push([`${L.name} is below the BSL it needs`, 1.3]);
  if(L.fault) f.push([`${L.name} has an equipment fault`, 1.3]);
  if(L.integrity < 50) f.push([`${L.name} integrity is low`, 1.2]);
  if(S.lead === 'vasko') f.push(['Vasko cuts corners', 1.25]);
  else if(S.lead === 'okafor') f.push(['Okafor runs a careful room', 0.85]);
  /* Who is actually in the room. Named so the player can see why the estimate moved. */
  const w = {kind:'study', type:id, sp:sp.id}, mode = studyMode(sp, id), crew = projectCrew(w, mode);
  const cf = crewFactors(crew, mode, id);
  if(crew.length){
    const key = MODE_STAT[mode] || 'bench';
    const avg = crew.reduce((n, a) => n + statOf(a, key), 0) / crew.length;
    if(avg >= 3) f.push([`${crew.length > 1 ? 'Crew is' : crew[0].name + ' is'} practised at this`, 0.8]);
    else if(avg <= 1) f.push([`${crew.length > 1 ? 'Crew is' : crew[0].name + ' is'} inexperienced at this`, 1.25]);
    for(const a of crew) for(const t of traitsOf(a)) if(t.risk && t.risk !== 1) f.push([`${a.name}: ${t.label.toLowerCase()}`, t.risk]);
  }
  const miss = missingExpert(id);
  if(miss) f.push([`No ${ROLES[miss].label.toLowerCase()} on station`, 1.15]);
  return f;
}
function riskEst(sp, id, o){ return clamp(riskBase(id) * riskFactors(sp, id).reduce((a, x) => a * x[1], 1) * mitOf(o).riskM, 0.02, 0.95); }
function riskTrue(sp, id, o){
  const t = sp.truth, L = labOf(sp) || S.labs[0];
  let m = t.lethal ? 1.35 : t.hazard === 'none' ? 0.7 : 1;
  if(ANIMAL(sp)) m *= t.agg > .6 ? 1.3 : t.agg < .38 ? 0.8 : 1;
  m *= 0.8 + sp.stress * 0.4;
  if(L.bsl < t.bsl) m *= 1.3;
  if(L.fault) m *= 1.3;
  if(L.integrity < 50) m *= 1.2;
  m *= S.lead === 'vasko' ? 1.25 : S.lead === 'okafor' ? 0.85 : 1;
  /* The crew that is really on it, not the projection the planner showed. */
  const it = itemFor(sp, id), mode = studyMode(sp, id);
  const crew = it && it.state === 'running' ? crewOf(it) : projectCrew({kind:'study', type:id, sp:sp.id}, mode);
  m *= crewFactors(crew, mode, id).risk;
  if(missingExpert(id)) m *= 1.15;
  return clamp(riskBase(id) * m * mitOf(o).riskM, 0.02, 0.95);
}
function riskLabel(p){ return p < 0.15 ? {name:'Low', cls:'low', n:1} : p < 0.3 ? {name:'Moderate', cls:'mod', n:2} : p < 0.48 ? {name:'High', cls:'high', n:3} : {name:'Severe', cls:'sev', n:4}; }

const COMPOUND_TYPES = {
  toxin:{label:'paralytic neurotoxin', value:40, dual:true, screen:'Blocks nerve signals at tiny doses. A surgical anesthetic, or a weapon.'},
  analgesic:{label:'analgesic peptide', value:50, dual:false, screen:'Kills pain without touching the opioid pathways. Hospitals will want this.'},
  antimicrobial:{label:'antimicrobial peptide', value:50, dual:false, screen:'Shreds bacterial membranes, including two resistant strains.'},
  enzyme:{label:'industrial enzyme', value:35, dual:false, screen:'Breaks down plastics at room temperature.'},
  pigment:{label:'photoprotective pigment', value:30, dual:false, screen:'Absorbs harsh light. Sunscreen, coatings, sensors.'},
  polymer:{label:'self-repairing biopolymer', value:45, dual:true, screen:'Reseals cracks on its own. Armor plating, or hull patches.'},
  bioelectric:{label:'bioelectric protein', value:50, dual:true, screen:'Stores and releases charge. The Physics Lab could build a power cell around it.'},
  cryo:{label:'cryoprotectant', value:40, dual:false, screen:'Keeps cells alive at deep cold. Organ transport, long missions.'},
  melanin:{label:'radiotrophic melanin', value:45, dual:false, screen:'Turns radiation into chemical energy. The Physics Lab could test it as shielding.'},
  alkaloid:{label:'psychoactive alkaloid', value:35, dual:true, screen:'Alters perception and suggestibility. Psychiatric use, or interrogation.'},
  adhesive:{label:'wet adhesive', value:30, dual:false, screen:'Sticks underwater and to living tissue. Surgical glue.'}
};
function genCompounds(sp){
  const t = sp.truth, out = [];
  const add = k => { if(!out.includes(k)) out.push(k); };
  if(t.hazard === 'venom'){ add('toxin'); add('analgesic'); }
  if(t.hazard === 'electric') add('bioelectric');
  if(t.hazard === 'pathogen') add('antimicrobial');
  if(t.hazard === 'acid') add('enzyme');
  if(t.hazard === 'spores') add('alkaloid');
  if(t.hazard === 'radiation') add('melanin');
  if(sp.form === 'crab' || sp.form === 'ironplant') add('polymer');
  if(sp.form === 'fungus') add('melanin');
  if(sp.form === 'crystal' || t.needs.temp === 'cryogenic' || t.needs.temp === 'near-freezing') add('cryo');
  if(sp.form === 'frond') add('pigment');
  if(sp.form === 'trap') add('adhesive');
  if(sp.kind === 'microbe') add(rnd() < .5 ? 'antimicrobial' : 'enzyme');
  for(const k of ['enzyme', 'pigment', 'adhesive', 'analgesic']) if(out.length < 2) add(k);
  const max = sp.kind === 'fossil' ? 1 : sp.kind === 'microbe' ? 2 : (rnd() < .5 ? 2 : 3);
  return out.slice(0, max);
}
let cmpSeq = 0, matSeq = 0;
function makeCompound(sp, type){
  const T = COMPOUND_TYPES[type];
  const c = {id:'c' + (++cmpSeq), type, name:`${sp.name} ${T.label}`, short:cap(T.label), sp:sp.id, spName:sp.name, value:T.value, dual:T.dual, state:'held', screened:false, synth:false, derived:false, battery:false, shield:false};
  S.compounds.push(c); return c;
}
const compoundValue = c => Math.round(c.value * (c.synth ? 1.5 : 1) * (c.screened ? 1.4 : 1) * (c.battery || c.shield ? 1.6 : 1));
function compoundChoice(c, intro){
  const v = compoundValue(c), ch = [];
  ch.push({label:`License to Meridian (+${v} cr)`, act:() => licenseCompound(c)});
  if(labOfType('micro') && !c.screened) ch.push({label:'Send to the Micro Lab for screening', act:() => { c.state = 'micro'; log('ops', 'admin', `${c.name} sent to the Micro Lab.`); S.dirty = true; }});
  if(labOfType('chem') && !c.synth) ch.push({label:'Send to the Chem Lab for synthesis', act:() => { c.state = 'chem'; log('ops', 'admin', `${c.name} sent to the Chem Lab.`); S.dirty = true; }});
  if(c.dual) ch.push({label:`Sell to the Directorate (+${Math.round(v * 1.8)} cr)`, act:() => sellCompound(c)});
  ch.push({label:'Hold it for now', act:() => { c.state = 'held'; S.dirty = true; }});
  say('pruitt', 'smug', `${intro} ${cap(c.short)} from ${c.spName}. Meridian will license it as is for ${v} cr.${!labOfType('micro') && !labOfType('chem') ? ' A Micro or Chem Lab could make it worth more.' : ''}${c.dual ? ' The Directorate has made a higher offer.' : ''}`, {log:false, choices:ch});
}
function licenseCompound(c){ const v = compoundValue(c); c.state = 'licensed'; S.funds += v; standing(1); log('pruitt', 'admin', `Licensed ${c.name} to Meridian: +${v} cr.`); S.dirty = true; }
function sellCompound(c){
  const v = Math.round(compoundValue(c) * 1.8); c.state = 'sold'; S.weapons = true; S.funds += v; standing(-4); log('whitcomb', 'admin', `Sold ${c.name} to the Directorate: +${v} cr.`);
  if(S.lead === 'okafor') say('okafor', 'angry', `That ${c.short.toLowerCase()} is a weapons program now. You know that.`, {kind:'warning'});
  S.dirty = true;
}
const MATERIALS = {
  garden:[['magnetite sand', false], ['biogenic clay', false]], hostile:[['volcanic glass', true], ['sulfide crust', true]], botanical:[['biogenic silica', false], ['amber resin', false]],
  barren:[['shock quartz', false], ['meteoric iron', false]], ice:[['clathrate ice', true], ['tidal brine', false]], cloud:[['metallic hydrogen trace', true], ['aerogel flakes', false]], cryo:[['tholin crust', false], ['nitrogen frost', true]]
};
function genMaterials(p){
  const out = [], n = 1 + (p.hazard >= 2 ? 1 : 0);
  for(let i = 0; i < n; i++){ const [name, volatile] = pick(MATERIALS[p.arch]); out.push({id:'m' + (++matSeq), name:`${cap(name)} (${p.name})`, base:name, planet:p.i, volatile, value:20 + p.hazard * 8, spectro:false, stressed:false, state:'held'}); }
  if(rnd() < .15) out.push({id:'m' + (++matSeq), name:`Exotic matter shard (${p.name})`, base:'exotic matter', planet:p.i, volatile:true, exotic:true, value:70, spectro:false, stressed:false, state:'held'});
  S.materials.push(...out);
  return out;
}

    const it = S.items.filter(x => x.lane === lane).sort((a, b) => a.start - b.start)[0];
    if(!it || it.state === 'running') continue;
    if(S.t < it.start){ if(it.why && !startBlock(it)) it.why = ''; continue; }
    const why = startBlock(it);
    if(why){
      it.why = why;
      /* Waiting on scheduled work parks at that work's end and stays put. A
         transient shortage (no crew free, lab halted) only steps the item aside
         when something else in the lane could use the slot; otherwise it holds
         position and retries, instead of crawling across the day for no reason. */
      const pre = preEndFor(it);
      const waiting = S.items.some(x => x.lane === lane && x !== it && x.state !== 'running');
      const nb = pre > S.t ? pre : waiting ? S.t + 1 : it.notBefore;
      if(nb !== it.notBefore){ it.notBefore = nb; planLane(lane); }

}
function completeItem(it){
  /* Credit the hours before the crew is released. */

  for(const a of did){ awardXp(a, disc, it.dur); if(it.multi) awardXp(a, 'nerve', it.dur * 0.1); }
  removeItem(it);
  if(it.kind === 'job'){
    const t = jobTargetById(it.type, it.tgt) || it.tobj;
    if(!t){ S.dirty = true; return; }
    const r = JOBS[it.type].run(t, it);
    S.dayDone.push({name:wName(it), text:r.text, spName:'', flagged:false});
    say(r.who || S.lead || 'okafor', r.mood || 'neutral', r.text, {kind:'finding'});
    if(r.after) r.after();
    S.dirty = true; return;
  }
  const sp = specById(it.sp), id = it.type;
  const V = S.lead === 'vasko', L = S.lead || 'okafor';
  const res = RUN[id](sp, it, V);
  if(res){
    if(res.text !== undefined){
      const why = recordFind(sp, id, res, it);
      if(why){
        res.flagged = true; res.ok = false;
        res.line = res.line ? [res.line[0] === 'excited' || res.line[0] === 'smug' ? 'uneasy' : res.line[0], res.line[1] + ' ' + why] : ['uneasy', why];
      }
    }
    if(res.line) say(L, res.line[0], res.line[1], {kind:res.kind || (res.flagged ? 'anomaly' : 'finding')});
    if(res.after) res.after();
  }
  S.dayDone.push({sp:sp.id, name:STUDIES[id].name(sp), text:res && res.text, flagged:!!(res && res.flagged), spName:sp.name});
  if(res && res.flagged) askRerun(sp, id);
  checkContradictions(sp);
  if(!sp.t1Said && tierDone(sp, 1) && sp.grantTier < 1){ sp.t1Said = true; S.ui.report = sp.id; sp.t1By = S.lead || 'okafor'; }
  else { const g = suggestFor(sp); if(g) notify(g.who, g.text, 'note'); }
  S.dirty = true;
}
function authorizeOTDay(d){
  if(S.ot[d] || (d === dayOf(S.t) && hourOf(S.t) >= WORK_END)) return;
  S.ot[d] = true; S.funds -= OT_COST; S.otCount++;
  log('pruitt', 'admin', `Overtime authorized for ${fmtT(d * 24).split(' ').slice(0, 2).join(' ')}: shift runs to ${OT_END}:00. ${OT_COST} cr.`);
  if(S.otCount === 3 && !S.hazardPay) notify('bea', "Third overtime shift. The techs are tired, and tired people skip steps.", 'warning');

}

/* A finding came back unreliable and later work is already queued on top of it.
   Stop and ask, because building a dossier on bad data is the mistake the game
   is about: a rerun costs a day, and not rerunning costs the paper. */
function askRerun(sp, id){
  const deps = S.items.filter(x => x.kind === 'study' && x.sp === sp.id && (PRE[x.type] || []).includes(id) && x.state !== 'running');
  if(!deps.length || !canQueueMore(sp, id)) return;
  const who = S.lead || 'okafor';
  const nm = STUDIES[id].name(sp).toLowerCase();
  const names = deps.map(x => STUDIES[x.type].name(sp).toLowerCase());
  say(who, 'uneasy', `The ${nm} on ${sp.name} is unreliable, and ${names.join(' and ')} ${deps.length > 1 ? 'are' : 'is'} queued behind it. Everything we build on this inherits the problem. Rerun it first, or carry on?`, {kind:'anomaly', choices:[
    {label:`Rerun the ${nm} first`, act:() => {
      const w = {kind:'study', type:id, sp:sp.id};
      const why = workBlock(w, S.ui);
      if(why){ notify('ops', why, 'admin'); return; }
      const it = makeItem(w, S.ui, fitSlot(S.t, wDur(w, S.ui), wMulti(w)));
      /* Push the work that depends on it behind the rerun. */
      for(const d of deps){ d.notBefore = Math.max(d.notBefore || 0, it.end); d.start = Math.max(d.start, it.end); }
      [...new Set([it.lane, ...deps.map(d => d.lane)])].forEach(planLane);
      S.dirty = true;
    }},
    {label:'Carry on with what we have', act:() => { log(who, 'note', `Director chose to build on the unreliable ${nm} for ${sp.name}.`); }}
  ]});
}
