/* ================= day cycle ================= */
// One stop per day: at the end of the shift the night passes on its own, and the planner opens at 08:00 with yesterday's results.
function endOfDay(){
  S.yesterday = {day:dayOf(S.t) + 1, done:S.dayDone.slice(), funds:Math.round(S.funds), net:Math.round(S.funds - S.fundsDay),
    notes:S.notes.filter(n => n.t > S.dayStartT && (n.kind === 'warning' || n.kind === 'anomaly')).map(n => ({who:n.who, text:n.text})),
    deaths:S.deaths - S.deathsDay, injuries:S.injuries - S.injDay};
  if(!S.specs.some(s => s.alive)){ nightSkip(); return; }
  if(S.speed) S.lastSpeed = S.speed;
  S.phase = 'evening'; S.ui.evening = true; S.ui.planner = false; S.speed = 0; S.dirty = true;
  checkWalkouts(); reportFriction(); dynamicsBriefing(); meridianTick();
  requestAutosave();
}
// Missions, maintenance and expansion are evening decisions once research is underway.
const canDecide = () => S.phase !== 'shift' || !S.specs.some(s => s.alive);
const decideWhy = () => canDecide() ? '' : 'Decided at the end of the shift.';
function closeDay(){ S.ui.evening = false; S.ui.planner = false; nightSkip(); }
function nightSkip(){
  let guard = 0;
  while(!S.over && hourOf(S.t) !== WORK_START && guard++ < 30) tick();
  if(S.over) return;
  S.dayStartT = S.t; S.fundsDay = S.funds; S.dayDone = []; S.deathsDay = S.deaths; S.injDay = S.injuries;
  staffDayTick(); budgetDayTick(); dynamicsDayTick(); refreshCandidates();
  if(S.specs.some(s => s.alive)){ if(S.speed) S.lastSpeed = S.speed; S.speed = 0; S.phase = 'morning'; }
  else S.phase = 'shift';
  requestAutosave();
  S.dirty = true;
}
function startDay(){ S.ui.planner = false; S.phase = 'shift'; S.speed = S.lastSpeed || 1; S.dirty = true; }
function researchTier(sp){
  if(!sp.alive) return 0;
  const t = sp.grantTier + 1; if(t > 3) return 0;
  if(topTier(sp) > sp.grantTier) return t;
  return STUDY_ORDER.some(id => STUDIES[id].tier === t && STUDIES[id].applies(sp) && !valid(sp, id) && (STUDIES[id].avail(sp) || itemFor(sp, id))) ? t : 0;
}
function refreshDeadline(){
  const tiers = S.specs.map(researchTier).filter(Boolean);
  if(!tiers.length){ if(S.deadline){ S.deadline = null; S.dirty = true; } return; }
  const tier = Math.min(...tiers);
  if(!S.deadline){ S.deadline = {t:(dayOf(S.t) + 10) * 24 + 20, tier}; S.dirty = true; }
  else S.deadline.tier = tier;
}
function checkDeadline(){
  refreshDeadline();
  const D = S.deadline; if(!D || S.t < D.t) return;
  standing(-8);
  say('pruitt', 'uneasy', `We missed Meridian's deadline for a Tier ${D.tier} paper. They've marked us down, and that comes out of the next renewal. They gave us one more week.`, {kind:'warning'});
  D.t += 7 * 24;
}

function incidentRoll(sp, e){
  const name = STUDIES[e.type].name(sp).toLowerCase();
  if(rnd() >= riskTrue(sp, e.type, e.opts)) return;
  const L = labOf(sp) || S.labs[0];
  const adequate = L.bsl >= sp.truth.bsl;
  let pb = adequate ? 0.12 : 0.7;
  pb *= (S.lead ? LEADS[S.lead].risk : 1) * (L.fault ? 1.8 : 1) * (L.integrity < 50 ? 1.5 : 1) * (0.7 + sp.stress * 0.6);
  if(e.type === 'stimulus' && e.opts.remote) pb *= 0.8;
  pb *= mitOf(e.opts).breachM;
  pb = clamp(pb, 0.03, 0.95);
  if(e.mode === 'bench' && !ANIMAL(sp)) pb *= adequate ? 0.6 : 0.9;
  if(rnd() < pb){ startBreach(sp, `during the ${name}`); return; }
  L.integrity = Math.max(0, L.integrity - 6);
  const inCell = actors().filter(a => a.job === e.id && a.kind === 'tech' && a.alive);
  let txt = `Something went wrong during the ${name}, and containment held.${e.opts.mit === 'none' ? ' We skipped the precautions on this one.' : ''}`;
  if(inCell.length && rnd() < (e.type === 'stimulus' && e.opts.remote ? 0.1 : 0.35) * (e.opts.mit === 'full' ? 0.4 : e.opts.mit === 'none' ? 1.4 : 1)){
    /* Nerve is who gets caught and how badly it goes for them. */
    const v = inCell.slice().sort((x, y) => statOf(x, 'nerve') - statOf(y, 'nerve'))[rnd() < 0.7 ? 0 : inCell.length - 1];
    const steady = statOf(v, 'nerve');
    if(sp.truth.lethal && rnd() < clamp(0.3 * (1.3 - steady * 0.2), 0.08, 0.45)){
      killTech(v, `${sp.truth.hazard === 'pathogen' ? 'infection' : 'exposure'} during the ${name}`);
      txt += ` We lost ${v.name}.`;
      inCell.filter(a => a !== v).forEach(a => scar(a, `watching ${v.name} go`));
    }
    else { v.injured = true; v.morale = clamp(v.morale - 12, 0, 100); S.injuries++; txt += ` ${v.name} was hurt and is out of rotation.${steady >= 3 ? ' Kept their head doing it, which is why it was not worse.' : ''}`; }
  }
  say('bea', 'uneasy', txt, {kind:'warning'});
}

// ---- 19-tier-1-report.js
/* ================= tier 1 report ================= */
const BIOCHEM_NAME = {methane:'liquid methane chemistry', silicon:'silicon-oxygen chemistry', ammonia:'ammonia-solvent chemistry', sulfur:'sulfur-based chemistry'};
function t2Program(sp){
  const ids = STUDY_ORDER.filter(id => STUDIES[id].tier === 2 && STUDIES[id].applies(sp) && !found(sp, id) && (STUDIES[id].avail(sp) || (id === 'biochem' && sp.truth.exotic) || (id === 'acoustic' && sp.flags.has('vocal'))));
  return {ids, cost:ids.reduce((a, id) => a + studyCost(sp, id, {...S.ui, mit:'std'}), 0)};
}
function tierReport(sp){
  const p = planetOf(sp), F = id => valid(sp, id), traits = [], apps = [];
  let score = 1;
  const exotic = ['methane', 'silicon', 'ammonia', 'sulfur'].includes(p.biochem) && sp.kind !== 'fossil';
  if(sp.flags.has('tools')){ score += 3; traits.push({t:'Tool marks', d:`Something on ${p.name} made tools and cut these bones. Every specimen from that world just got more important, and harder to treat as inventory.`}); }
  else if(sp.flags.has('ruins')){ score += 2; traits.push({t:'Regular cut marks', d:'The bones carry marks that look deliberate. Isotope work on the rock around them could say what made them.'}); }
  if(sp.flags.has('vocal')){ score += 2; traits.push({t:'Vocalization', d:`It makes sound on purpose. Acoustic analysis (Tier 2) can tell whether the calls have structure. If they do, this stops being a pure biology question.`}); }
  if(exotic){ score += 2; traits.push({t:'Non-standard biochemistry', d:`It runs on ${BIOCHEM_NAME[p.biochem]}. The sequencer won't read it until biochemistry characterization (Tier 2) tells us how. Nobody at the partner labs has seen anything like it.`}); }
  if(sp.flags.has('dormant')){ score += 2; traits.push({t:'Dormant cells', d:'Something in the residue is still alive. Culture revival (Tier 2) could wake it. That is a high-risk study on a known pathogen. Plan full precautions.' }); }
  if(sp.kind === 'fossil' && sp.truth.genome === 'viable' && F('sample')){ score += 2; traits.push({t:'Intact organics', d:'The core is better preserved than it has any right to be. Sequencing (Tier 2) might recover enough genome for a de-extinction line (Tier 3).'}); }
  if(sp.truth.yield && F('assay')){ score += 2; }
  if(ANIMAL(sp) && sp.flags.has('motile')) traits.push({t:'Behavior under pressure', d:`Partner labs will handle ${sp.name} hands-on. Sedative clearance and a provocation test (Tier 2) tell them how long the drug lasts and what it does when cornered.`});
  if((sp.kind === 'flora' || sp.kind === 'microbe') && F('obs')) traits.push({t:'Spread pattern', d:'A spread test (Tier 2) answers the question every partner lab will ask first: will our seals hold it?'});
  if(F('habitat') && sp.truth.sensitive){ score += 1; traits.push({t:'Narrow habitat', d:`It needs ${sp.truth.needs.light}, ${sp.truth.needs.pressure} pressure, ${sp.truth.needs.temp} temperatures. Labs that skip that step get a stressed specimen, and stressed specimens breach.`}); }
  if(sp.kind !== 'fossil') traits.push({t:'Genome', d:'Sequencing (Tier 2) opens a cloning line. A cloned population means no more recovery trips for this species.'});
  const y = sp.truth.yield;
  if(y && F('assay')) apps.push({t:cap(y.type), d:`Compound extraction (Tier 2) could isolate it for licensing to Meridian.${y.dual ? ' The Directorate will want it too. Their money is better, and they want it as a weapon.' : ''}`, dual:!!y.dual});
  if(sp.kind === 'fossil') apps.push({t:'Deep-time record', d:`${sp.truth.age ? 'Hundreds of millions of years' : 'Deep time'} of ${p.name}'s history in one core. Paleobiology grants are small but steady.`});
  if(exotic) apps.push({t:'Exotic materials science', d:'Chemistry that works where ours freezes or burns. Industrial partners pay for that kind of thing.'});
  if(sp.flags.has('vocal') || sp.flags.has('tools')) apps.push({t:'Xenolinguistics and contact', d:'The best-funded work in the field, and the most dangerous to get wrong. If it turns out to be a person, consent stops being a formality.'});
  apps.push({t:'Reference dossier', d:`Every partner lab working with ${sp.name} follows your papers. A fuller dossier means fewer people hurt somewhere else.`});
  const hz = sp.truth.hazard, known = F('assay');
  const risk = !known ? 'Unknown' : ['venom', 'electric', 'pathogen'].includes(hz) ? 'Severe' : hz === 'none' ? (F('obs') && sp.find.obs.stance === 'danger' ? 'Elevated' : 'Low') : 'Elevated';
  const via = score >= 7 ? 'Exceptional' : score >= 5 ? 'Strong' : score >= 3 ? 'Moderate' : 'Limited';
  const prog = t2Program(sp);
  const by = sp.t1By || 'okafor', V = by === 'vasko';
  let rec;
  if(score >= 5) rec = V ? `This is a career, Director. Publish fast, then put everything into Tier 2.` : `Worth a second tier. Publish what we have first, so the partner labs aren't guessing, then start Tier 2.`;
  else if(score >= 3) rec = V ? `Decent. Publish, take the grant, and cherry-pick the Tier 2 studies that pay.` : `Publish Tier 1. Then pick the Tier 2 studies that close the biggest safety gaps before the ones that look good in a press release.`;
  else rec = V ? `Not much here. Publish it and ship it out. We need the lab for something interesting.` : `There isn't much left to learn that justifies the lab. Publish Tier 1, ship it to Meridian, and use the lab for the next recovery.`;
  if(sp.flags.has('vocal') && !V) rec += ' And I want acoustic work done before anyone sedates it again.';
  if(apps.some(a => a.dual) && !V) rec += ' Please do not sell the compound to Whitcomb.';
  return {score:Math.min(score, 8), via, risk, traits, apps, rec, by, prog};
}

// ---- 20-study-results.js
/* ================= study results ================= */
/* A finding can be unreliable for reasons the handlers already know about
   (sedation, a truncated protocol, unreadable biochemistry). On top of those, who
   ran it matters: an inexperienced crew, a slot too short to do it properly, or
   nobody on station who understands the work all produce data you cannot bank.
   Returns the reason to add to the lead's line, or '' when the run was clean. */
function recordFind(sp, id, r, it){
  let flagged = !!r.flagged, ok = r.ok !== false, why = '';
  if(!flagged && it){
    const crew = crewOf(it), q = crewFactors(crew, it.mode, id).quality * headPenalty(it.lane).quality;
    const p = clamp(0.05 * q + (it.rushed ? 0.16 : 0), 0, 0.55);
    if(rnd() < p){
      flagged = true; ok = false;
      const miss = missingExpert(id);
      const key = MODE_STAT[it.mode] || 'bench';
      const weak = crew.slice().sort((a, b) => statOf(a, key) - statOf(b, key))[0];
      const unheaded = laneLab(it.lane) && !labHeaded(laneLab(it.lane)) ? laneLab(it.lane) : null;
      why = unheaded ? `${unheaded.name} has nobody at its head, and nobody checked this before it was filed. Flagged as unreliable.`
        : miss ? `Nobody here is a ${ROLES[miss].label.toLowerCase()}, and it shows. Flagged as unreliable.`
        : it.rushed ? 'We ran out of shift and cut it short. Flagged as unreliable.'
        : weak ? `${weak.name} has not done enough of these. Flagged as unreliable, and worth a rerun.`
        : 'The run was not clean. Flagged as unreliable.';
    }
  }
  sp.find[id] = {text:r.text, ok, flagged, stance:r.stance || r.text, by:S.lead === 'vasko' ? 'Vasko' : 'Okafor', t:S.t,
    crew:it && it.crew ? it.crew.slice() : [], why};
  return why;
}
const pre = (V, a, b) => V ? a : b;
const RUN = {
  obs(sp, e, V){
    if(ANIMAL(sp)){
      while(e.reps.length < e.opts.reps) e.reps.push({v:measureAgg(sp), sed:sp.sed, t:S.t});
      const vals = e.reps.map(r => r.v), mean = vals.reduce((a, b) => a + b, 0) / vals.length, maxSed = Math.max(...e.reps.map(r => r.sed));
      const cls = classify(mean), scores = vals.map(f2).join(', ');
      const text = {docile:'Docile under observation', wary:'Wary under observation', aggressive:'Aggressive, high arousal even at rest'}[cls] + ` (mean ${f2(mean)}, n=${vals.length})`;
      const ok = cls === truthClass(sp), stance = cls === 'aggressive' ? 'danger' : 'safe';
      sp.flags.add('motile');
      let voc = '';
      if(sp.truth.vocal){ sp.flags.add('vocal'); voc = ` It vocalizes. ${soundNote(planetOf(sp))}`; }
      if(!V && maxSed > .2){
        const h = sinceSed(sp);
        return {text, ok, flagged:true, stance, line:['uneasy', `Scores ${scores}. I'm flagging this as unreliable: ${sp.name} was sedated ${h} hours ago.${e.opts.control ? ' The drug assay confirms it.' : ''}${vals.length > 1 && vals[vals.length - 1] - vals[0] > .08 ? ' The scores climbed every session as the drug wore off.' : ''} Rerun after a full washout.${voc}`]};
      }
      const lineV = {docile:['excited', `Scores ${scores}, mean ${f2(mean)}. Docile. We can relax the protocols on this one.${voc}`], wary:['smug', `Scores ${scores}, mean ${f2(mean)}. Wary, not dangerous. It'll settle.${voc}`], aggressive:['excited', `Scores ${scores}, mean ${f2(mean)}. It's a killer. Gorgeous. Give me a provocation test.${voc}`]}[cls];
      const lineO = {docile:['neutral', `Scores ${scores}, mean ${f2(mean)}. Low arousal. I'd still replicate before trusting it.${voc}`], wary:['neutral', `Scores ${scores}, mean ${f2(mean)}. Wary. Clean run.${voc}`], aggressive:['alarmed', `Clean run, no sedative on board. Scores ${scores}, mean ${f2(mean)}. It's dangerous.${voc}`]}[cls];
      if(V && e.opts.control && maxSed > .1) lineV[1] += ' The drug assay picked up some leftover sedative. Trace levels. Irrelevant.';
      return {text, ok, stance, line:V ? lineV : lineO};
    }

    let text;
    if(sp.kind === 'flora') text = ({frond:`Fronds track the ${STARS[p.star].desc}'s light and fold shut at night`, trap:'Sticky traps snap shut on anything that moves within 3 cm', fungus:'Black caps grow toward radiation, not light', ironplant:'Plates itself with iron oxide as it grows', crystal:'Grows faceted lattices only below -170°C'})[sp.form] + `. Pigment: ${STARS[p.star].floraName}`;
    else if(sp.kind === 'microbe') text = `Colonies double every ${sp.truth.doubling} hours${sp.truth.biochem !== 'carbon-water' ? ' in a medium we had to improvise' : ''}`;
    else text = `Fragments of a ${pick(['small', 'large', 'very large'])} ${pick(['radially symmetric', 'segmented', 'six-limbed', 'shelled'])} organism${sp.truth.ruins ? '. Several bones show regular cut marks' : ''}`;
    if(sp.truth.ruins) sp.flags.add('ruins');

  sample(sp, e, V){

    const p = planetOf(sp);
    const t = ({dome:`Spined dome body; spines laced with ${pick(['tessellite', 'iron-silica', 'magnetite'])} crystals`, strider:`Six jointed legs built for ${p.g > 1.2 ? 'heavy' : 'light'} gravity (${p.g} g)`, serpent:'Long segmented body with a sensory frill',
      crab:'Armor plating mineralized with biological iron', blind:'No eyes; electroreceptive pits along the flanks', lithovore:'Grinding plates that chew rock for minerals',
      gasbag:`Gas bladders filled with ${p.atm === 'h2' ? 'hydrogen' : 'a light gas mix'}; trailing feeding tendrils`, frond:'Thin fronds with dense pigment layers', trap:'Hinged traps lined with digestive glands',
      fungus:'Melanin-packed caps that turn radiation into chemical energy', ironplant:'Stems sheathed in iron oxide scales', crystal:'Cells with rigid, phase-changing membranes',
      culture:`Single cells, ${pick(['rod-shaped', 'spherical', 'spiral'])}, with an unusual cell wall`, fossil:`Mineralized tissue with ${sp.truth.genome === 'viable' ? 'surprisingly intact' : 'heavily degraded'} organic traces`})[sp.form];
    return {text:t, ok:true, line:[V ? 'excited' : 'neutral', pre(V, `Sample's in. ${t}. Bench studies are open.`, `Clean sample. ${t}. That opens the bench studies.`)]};
  },
  habitat(sp, e, V){

  },
  age(sp, e, V){
    const text = `About ${sp.truth.age} million years old${sp.truth.ruins ? '. The cut marks are tool marks' : ''}`;

  clearance(sp, e, V){

  biochem(sp, e, V){

};

// ---- 22-papers.js
/* ================= papers ================= */
function checkContradictions(sp){
  if(!sp.paper) return;
  const bad = sectionsFor(sp).filter(s => claimStatus(sp, s)[1] === 'bad');
  if(bad.length && !sp.papersAlert){ sp.papersAlert = true; notify('pruitt', `The published paper on ${sp.name} no longer matches your data (${bad.map(s => secLabel(sp, s)).join(', ')}). Partner labs are still following it.`, 'warning'); }
  if(!bad.length) sp.papersAlert = false;
}
function claimStatus(sp, sec){
  const p = sp.paper && sp.paper.claims[sec], c = claimFor(sp, sec);
  if(!p && !c) return ['Not studied', ''];
  if(!p && c) return ['New data, not in the paper yet', 'new'];
  if(p && !c) return ['Since flagged as unreliable', 'bad'];
  if((p.stance || p.text) !== (c.stance || c.text)) return ['Contradicted by newer data', 'bad'];
  if(p.text !== c.text) return ['Newer data adds detail', 'new'];
  return ['Matches your data', 'ok'];
}
function snapshotClaims(sp){ const o = {}; sectionsFor(sp).forEach(s => { const c = claimFor(sp, s); o[s] = c ? {text:c.text, ok:c.ok, stance:c.stance} : null; }); return o; }
function publishPay(sp){ const t = topTier(sp); return t > sp.grantTier ? {tier:t, amt:renewalFor(t)} : {tier:sp.grantTier, amt:0}; }
const PARTNERS = ['Kepler Deep Lab', 'Halden Station', 'Vireo Biolabs'];
function hazards(sp, c, rec){
  const H = [], t = sp.truth;
  if(ANIMAL(sp)){
    if(!c.behavior) H.push({sec:'behavior', p:.3, kind:'beh-missing'});
    else if(!c.behavior.ok) H.push({sec:'behavior', p:t.agg > .6 ? .75 : .3, kind:'beh-wrong', claim:c.behavior.text});
    if(!c.handling) H.push({sec:'handling', p:.3, kind:'hand-missing'});
    else if(!c.handling.ok) H.push({sec:'handling', p:.65, kind:'hand-wrong'});
  }
  if(t.hazard !== 'none' && !c.hazard) H.push({sec:'hazard', p:t.lethal ? .6 : .4, kind:'haz-missing'});
  if(sp.kind !== 'fossil' && t.sensitive && (!c.habitat || !c.habitat.ok)) H.push({sec:'habitat', p:.5, kind:'hab'});
  if(sp.kind !== 'fossil' && rec < t.bsl) H.push({sec:'containment', p:clamp(.3 + .25 * (t.bsl - rec), 0, .9), kind:'bsl'});
  return H;
}
function buildIncident(sp, h, rec){
  const lab = PARTNERS[S.labIdx++ % PARTNERS.length], t = sp.truth, n = sp.name;
  let deaths = 0, cost = 0, text = '';
  const dead = k => k === 1 ? '1 dead.' : `${k} dead.`;
  switch(h.kind){
    case 'beh-wrong': deaths = rnd() < .4 ? 2 : 1; text = `${lab} took your paper at its word that ${n} is "${h.claim.split(' (')[0].toLowerCase()}". A handler reached into the enclosure. ${dead(deaths)}`; break;
    case 'beh-missing': deaths = t.agg > .5 ? 1 : 0; cost = deaths ? 0 : 10; text = `Your paper said nothing about how ${n} behaves. ${lab} treated it like any new arrival. ${deaths ? 'It struck a handler during intake. 1 dead.' : 'A handler was hurt during intake.'}`; break;
    case 'haz-missing':
      if(t.hazard === 'pathogen'){ deaths = 2; text = `Three techs at ${lab} fell ill after working with ${n} on an open bench. Your paper listed no pathogen. 2 dead.`; }
      else if(t.hazard === 'venom' || t.hazard === 'electric'){ deaths = 1; text = `A tech at ${lab} was ${t.hazard === 'venom' ? 'grazed through a standard glove' : 'hit by a discharge through a wet glove'}. Your paper said nothing about it. 1 dead.`; }
      else { cost = 20; text = ({acid:`${n}'s acid burned through a glove at ${lab}. A tech lost two fingers.`, spores:`${lab} opened the ${n} enclosure without respirators. Six techs hospitalized.`, radiation:`${lab} stored ${n} next to a break room. Dosimeters went off a week later.`})[t.hazard]; }
      break;
    case 'hand-wrong': deaths = 1; text = `${lab} followed your sedation timing and went in early. ${n} was awake. 1 dead.`; break;
    case 'hand-missing': cost = 15; text = `${lab} guessed at sedation timing for ${n} and guessed short. A handler was injured. They are suing.`; break;
    case 'hab': cost = 15; text = `${lab} kept ${n} in standard conditions. Every specimen died within a week. Meridian is billing you.`; break;
    case 'bsl': deaths = t.lethal ? 2 : 0; cost = deaths ? 0 : 25; text = `${lab} built to your BSL-${rec} recommendation. ${n} got out on day two. ${deaths ? dead(deaths) : 'Nobody died. The facility is contaminated.'}`; break;
  }

}
function publish(sp, rec){
  const claims = snapshotClaims(sp), grant = publishPay(sp), pay = grant.amt, first = !sp.paperV;
  const fixed = [];
  S.pending = S.pending.filter(inc => {
    if(inc.sp !== sp.id) return true;
    const ok = inc.sec === 'containment' ? rec >= sp.truth.bsl : !!(claims[inc.sec] && claims[inc.sec].ok);
    if(ok) fixed.push(inc.lab);
    return !ok;
  });
  for(const h of hazards(sp, claims, rec)){
    if(S.pending.some(p => p.sp === sp.id && p.sec === h.sec)) continue;
    if(rnd() < h.p) S.pending.push(buildIncident(sp, h, rec));
  }
  sp.paperV++;

  sp.papersAlert = false;
  if(pay){
    const cut = Math.min(pay, S.bridgeDebt || 0);
    S.bridgeDebt = (S.bridgeDebt || 0) - cut;
    S.funds += pay - cut; S.granted += pay; sp.grantTier = grant.tier;
    S.deadline = null;
    if(cut) log('pruitt', 'admin', `${cut} cr of the renewal went back to Meridian to repay the bridge advance.`);
    if(grant.tier >= 1 && sp.grantTier === grant.tier) notify('pruitt', `Paper accepted. Tier ${grant.tier + 1} studies on ${sp.name} are open now.`);
  }

  log('pruitt', 'admin', `Paper v${sp.paperV} on ${sp.name} published (BSL-${rec} recommended, ${n} of ${tot} sections).${pay ? ` Grant renewed: +${pay} cr.` : ''}`);
  say('pruitt', 'smug', first ? `The ${sp.name} paper is out${pay ? `, and Meridian renewed the grant: ${pay} credits` : ''}. The partner labs are receiving their own specimens under your protocol.` :
    `Version ${sp.paperV} on ${sp.name} is out.${pay ? ` It completes Tier ${grant.tier}. Grant renewed: ${pay} credits.` : ''}${fixed.length ? ` ${[...new Set(fixed)].join(' and ')} got the correction in time.` : ''}`, {log:false});
  if(sp.person === 'ignored' && !sp.leaked){ sp.leaked = true; S.pending.push({sp:sp.id, sec:'ethics', lab:'The press', deaths:0, cost:30, text:`Dr. Okafor's report reached the press. The headline calls ${sp.name} "the people Meridian files as specimens."`, at:S.t + 24}); }
  S.dirty = true;
}
function retract(sp){
  if(!sp.paper) return;
  S.pending = S.pending.filter(p => p.sp !== sp.id || p.sec === 'ethics'); sp.paper = null; sp.papersAlert = false;
  S.funds -= 20; standing(-15);
  log('pruitt', 'warning', `Paper on ${sp.name} retracted. Partner labs halted that work. Retraction cost 20 cr.`);
  say('pruitt', 'uneasy', `Retraction filed. The partner labs have stopped all work on ${sp.name} until we publish again.`, {log:false});

}
function fireIncident(inc){
  S.downstream += inc.deaths; S.funds -= inc.cost; standing(inc.deaths ? -10 * inc.deaths : -6);
  S.reports.push({t:S.t, lab:inc.lab, text:inc.text, deaths:inc.deaths});
  say('pruitt', inc.deaths ? 'alarmed' : 'uneasy', `Report from ${inc.lab}. ${inc.text}`, {kind:'warning'});
  if(inc.cost) log('ops', 'admin', `Meridian legal: damages, ${inc.cost} cr.`);
  if(inc.deaths){
    if(S.lead === 'okafor') say('okafor', 'numb', 'They trusted our paper. That was our data.', {kind:'note'});
    else if(S.lead === 'vasko') say('vasko', 'uneasy', "Their handling must have been sloppy. That's not on us. ...Is it?", {kind:'note'});
  }
}


// ---- 23-missions.js
/* ================= missions ================= */
function missionCost(p){ return S.firstMission ? 0 : 25 + p.hazard * 8; }
function missionBlock(p){
  if(!p.known) return 'Unknown planet.';
  if(S.mission) return 'A recovery team is already out.';
  if(S.breach) return 'Deal with the breach first.';
  if(!canDecide()) return 'Recovery teams launch at the end of the shift.';
  if(!ARCH[p.arch].pool.some(k => openLabs(k).length)) return openLabs().length || S.labs.some(L => L.built && L.type !== 'containment' && LAB_TYPES[L.type].holds.length) ? `No open lab for what lives on ${p.name}. ${ARCH[p.arch].pool.some(k => k === 'fossil') ? 'Fossils need the Genetics Lab. ' : ''}${ARCH[p.arch].pool.includes('microbe') ? 'Microbes need the Micro Lab.' : ''}`.trim() : 'No open lab. Build a new lab or free one up before bringing anything back.';
  if(onStation().filter(a => !a.injured).length < 3) return 'You need at least 3 healthy techs on station to send 2.';
  return '';
}
function dispatch(p){
  if(missionBlock(p)) return;

  if(team.length < 2) return;
  const free = S.firstMission;
  S.funds -= missionCost(p);
  if(free) log('pruitt', 'admin', 'Meridian covered the cost of the first recovery trip.');
  team.forEach(a => { a.away = true; a.inLab = false; a.task = 'idle'; a.path = []; });
  S.mission = {planet:p.i, start:S.t, dur:p.dist, team:team.map(a => a.name)};
  S.flight = {dir:'out', p:0};
  log('rook', 'admin', `Recovery team dispatched to ${p.name} (${p.nick}) with ${team.map(a => a.name).join(' and ')}. Round trip about ${p.dist * 2} h.`);
  notify('rook', `Rook Adebayo here. We're away for ${p.name}. Back in about ${p.dist * 2} hours.`);
  S.dirty = true;
}
function firstKind(p){ const pool = ARCH[p.arch].pool; return pool.includes('fauna') ? 'fauna' : pool.includes('floater') ? 'floater' : pool.includes('flora') ? 'flora' : pool.find(k => openLabs(k).length) || pool[0]; }
function missionReturn(){
  const m = S.mission, p = S.planets[m.planet]; S.mission = null;
  const first = S.firstMission; S.firstMission = false;
  S.flight = {dir:'in', p:0};
  const risk = first ? 0 : [0.02, 0.05, 0.1, 0.18, 0.3][p.hazard];
  const team = S.techs.filter(a => m.team.includes(a.name));
  const lost = [];
  team.forEach(a => { a.away = false; a.u = LANDING[0]; a.v = LANDING[1]; a.path = [homeNode(a)]; if(rnd() < risk){ a.alive = false; S.deaths++; lost.push(a.name); } });
  const roll = rnd();
  let count = first ? 1 : p.hazard >= 3 ? (roll < .2 ? 0 : roll < .5 ? 1 : roll < .8 ? 2 : 3) : (roll < .12 ? 0 : roll < .55 ? 1 : roll < .88 ? 2 : 3);
  const haul = [], left = {}, pool = ARCH[p.arch].pool;
  for(let i = 0; i < count; i++){
    let kind = first ? firstKind(p) : pick(pool);
    if(!openLabs(kind).length){ const alt = pool.find(k => openLabs(k).length); if(alt && rnd() < .5) kind = alt; }
    if(!openLabs(kind).length){ left[kind] = (left[kind] || 0) + 1; continue; }
    const s = genSpecimen(p, kind, {tutorial:first});
    S.specs.push(s); placeSpecimen(s); haul.push(s);
    if(ANIMAL(s)){ s.sed = .5; s.lastSedT = S.t - 4; }
  }
  const mats = first ? [] : genMaterials(p);
  if(haul.length && !S.ui.spec) S.ui.spec = haul[0].id;
  if(haul.length && S.nextInspect > 1e8) S.nextInspect = inspectAt(S.t + 48);
  p.recovered += haul.length;
  if(haul.length){
    let g = 0; for(const s of haul){ g += ARRIVAL_GRANT + (S.kindsSeen.has(s.kind) ? 0 : 20); S.kindsSeen.add(s.kind); }
    S.funds += g; S.granted += g;
    log('pruitt', 'admin', `Meridian grant for new specimen${haul.length > 1 ? 's' : ''}: +${g} cr.`);
    notify('pruitt', `Meridian sent ${g} cr for ${haul.length > 1 ? 'the new specimens' : `${haul[0].name}`}. New material keeps the money coming.`);
  }
  let disc = null;
  const prior = p.missions; p.missions++;
  const hidden = S.planets.find(q => !q.known && q.link === p.i);
  if(hidden && prior >= 1 && (prior >= 2 || rnd() < .45)){ hidden.known = true; disc = hidden; }
  let txt = haul.length ? `We're back from ${p.name}. Recovered ${haul.map(s => `${s.name} (${KIND_LABEL[s.kind].toLowerCase()}) into ${labOf(s).name}`).join(', ')}.` : `We're back from ${p.name}, empty-handed. Weather never cleared.`;
  const lk = Object.keys(left);
  if(lk.length) txt += ` We also found ${lk.map(k => `${left[k] > 1 ? left[k] + ' ' : 'a '}${KIND_LABEL[k].toLowerCase()}${left[k] > 1 && k !== 'fauna' ? 's' : ''}`).join(' and ')} but had no ${lk.map(k => LAB_TYPES[labTypeFor(k)].label === 'Containment' ? 'open containment lab' : LAB_TYPES[labTypeFor(k)].label + ' Lab').join(' or ')} for ${Object.values(left).reduce((a, b) => a + b, 0) > 1 ? 'them' : 'it'}, so we left ${Object.values(left).reduce((a, b) => a + b, 0) > 1 ? 'them' : 'it'} on the surface.`;
  if(mats.length) txt += ` We bagged ${mats.map(m => m.base).join(' and ')} for ${labOfType('physics') ? 'the Physics Lab' : 'the stores, until there is a Physics Lab to study it'}.`;
  if(lost.length) txt += ` We lost ${lost.join(' and ')} down there.`;
  if(disc) txt += ` One more thing. We picked up a signal on the way home and traced it to ${disc.name}. It's not on any chart. It's on the star map now.`;
  say('rook', lost.length ? 'numb' : disc ? 'excited' : 'neutral', txt, {kind:lost.length ? 'warning' : 'note'});
  if(first && haul.length){
    const s = haul[0];
    if(ANIMAL(s)) say('bea', 'uneasy', `${s.name} is in Lab A. One thing before anyone scores its behavior: Rook sedated it for the trip home. Watch it now and you're measuring the drug, not the animal. Use the washout option on the observation.`, {kind:'note'});
    else say('bea', 'neutral', `${s.name} is sealed in Lab A. Start with an observation. Nothing gets out during a sealed study.`, {kind:'note'});
  }
  if(lost.length && !S.hazardAsked){ S.hazardAsked = true; hazardDemand(); }
  S.dirty = true;
}

function hazardDemand(){

    {label:'Refuse', act:() => { S.slowdown = true; log('bea', 'admin', 'Hazard pay refused. Techs working strictly to protocol.'); say('bea', 'numb', "Then it's by the book. Every step. Slowly.", {log:false}); }}

}
function killTech(a, cause){
  if(!a || !a.alive) return;

function registerSkip(a){

      {label:'Thanks. Keep reporting these.', act:() => {}},

    ]});

function assignLead(id){
  const L = LEADS[id]; if(L.quit || S.lead === id) return;

  if(S.over) return;
  S.lead = id;

    if(bad.length){
      say('okafor', 'uneasy', `I went through Dr. Vasko's notes. I'm flagging ${bad.join(', ')}. Sedated animals, cut-short sampling. None of it was marked.`, {kind:'anomaly'});

function pullLead(silent){

  const L = LEADS[id]; L.pulls++;
  if(L.actor.task === 'work') sendHome(L.actor);

}

   their own schedule rather than yours. Nothing in this file is a joke at the
   expense of anyone who got hurt: the comedy is that the institution cannot tell
   the difference between a dead colleague and a line item, and says so in writing. */

  {who:'pruitt', when:() => S.techs.filter(a => a.alive).length > 6, text:() => 'Payroll has queried why a research station this size employs this many people. I have replied explaining what the work is. I expect they will query it again.'},
  {who:'ops', when:() => true, text:() => 'Meridian IT advise that the station password policy now requires a symbol. The station has one terminal and no door.'},
  {who:'pruitt', when:() => S.injuries > 0, text:() => 'Occupational Health have offered everyone a workstation assessment. They mean chairs.'},
  {who:'pruitt', when:() => S.standing < 45, text:() => 'There is a new reporting line between this station and head office. It is called an oversight partnership. It is a man named Keith who wants a weekly call.'},
  {who:'ops', when:() => S.labs.some(L => L.built && L.integrity < 70), text:() => 'Meridian Facilities have closed the maintenance ticket for this station. The resolution field reads "monitoring".'},
  {who:'pruitt', when:() => specialists().length >= 2, text:() => 'Meridian would like the specialists to record a short video about what drew them to xenobiology. For the careers page.'},
  {who:'pruitt', when:() => S.weapons, text:() => 'The Directorate sent a hamper. I have put it in the hub. Nobody has opened it.'},

];
/* One every few days, never during a breach, never at the moment of a death. */
function meridianTick(){
  if(S.breach || S.over || !S.specs.length) return;
  if(S.t < (S.nextBulletin || 0)) return;
  S.nextBulletin = S.t + 72 + Math.floor(rnd() * 72);
  S.saidBulletins = S.saidBulletins || [];
  const pool = BULLETINS.map((b, i) => ({b, i})).filter(x => !S.saidBulletins.includes(x.i) && x.b.when());

// ---- 25-walkthroughs.js
/* ================= walkthroughs ================= */
function startWalkthrough(kind){
  const path = [{u:2.4, v:1.2}];
  for(const row of ['E', 'S']){
    const labs = rowLabs(row).filter(L => L.built); if(!labs.length) continue;
    path.push(hubExit(row)[0]);
    labs.forEach((L, idx) => { path.push(labNode(L, 4.7, 1.9, {wait:1.2}), labNode(L, 6.4, 2.0, {wait:1.0}), labNode(L, 6.9, 3.9), labNode(L, 9.0, 3.9, {wait:1.0})); if(idx < labs.length - 1) path.push(labNode(L, 11.1, 3.9), labNode(L, 12.4, 2.0)); });
    for(let j = labs.length - 1; j >= 0; j--){ const L = labs[j]; if(j < labs.length - 1) path.push(labNode(L, 12.4, 2.0), labNode(L, 11.1, 3.9)); path.push(labNode(L, 6.9, 3.9), labNode(L, 6.4, 2.0), labNode(L, 4.4, 2.0)); }
    path.push(hubExit(row)[0]);
  }
  path.push({u:2.4, v:2.6});
  S.inspector = {kind, caught:0, alive:true, u:LANDING[0], v:LANDING[1], wait:0, task:'inspect', flash:0, path,
    look:{skin:PEOPLE.calderon.skin, hair:PEOPLE.calderon.hair, coat:'#e0702a', accent:'#f2d14a', clip:true}};
  if(kind === 'scheduled'){ S.nextInspect = inspectAt(S.t + 72); S.inspectWarned = false; }
  else { S.lastSurprise = S.t; S.labs.forEach(L => { L.haltUntil = Math.max(L.haltUntil, S.t + 2); }); notify('calderon', 'Surprise safety walkthrough. Nobody touch anything.', 'admin'); }
  S.dirty = true;
}
function stepInspector(dt, mult){
  const a = S.inspector; if(!a) return;
  if(a.wait > 0){ a.wait -= dt * mult; a.walking = false; return; }
  const n = a.path[0];
  if(!n){ finishWalkthrough(); return; }
  const du = n.u - a.u, dv = n.v - a.v, d = Math.hypot(du, dv), sp = 1.2 * dt * mult;
  a.walking = true;
  if(d <= sp){ a.u = n.u; a.v = n.v; a.path.shift(); if(n.wait) a.wait = n.wait; }
  else { a.u += du / d * sp; a.v += dv / d * sp; }
}
function finishWalkthrough(){
  const I = S.inspector; S.inspector = null;
  const surprise = I.kind === 'surprise';
  let caught = I.caught;
  for(let i = 0; i < Math.max(0, S.skipsSince - I.caught); i++) if(rnd() < (surprise ? .85 : .4)) caught++;
  S.skipsSince = 0;
  const F = [], choices = [];
  if(caught) F.push(`${caught} decon skip${caught > 1 ? 's' : ''} on the lab exits since my last walkthrough${S.lead === 'vasko' ? ", mostly Dr. Vasko's crew" : ''}.`);
  if(caught && S.reportsMuted) F.push('The techs say they were told to stop filing near-miss reports. That is a violation in itself.');
  let fixLab = null, upLab = null, matchLab = null;
  for(const L of S.labs.filter(l => l.built)){
    const cs = labSpec(L);
    if(L.fault && rnd() < (surprise ? .95 : .6)){ L.fault = false; F.push(`${L.name}: a seal on the tank feed port was failing. My team replaced it before it let go.`); }
    if(L.integrity < 60){ F.push(`${L.name}: hairline fractures in the glazing, integrity ${Math.round(L.integrity)}%.`); fixLab = fixLab || L; }
    if(!cs) continue;
    const cc = claimFor(cs, 'containment'), bc = claimFor(cs, 'behavior');
    let need = 0;
    if(cc && cs.truth.bsl > L.bsl) need = cs.truth.bsl;
    else if(!cc && bc && bc.stance === 'danger' && L.bsl < 3) need = 3;
    if(need){ F.push(`${L.name}: ${cs.name} is housed at BSL-${L.bsl}. ${cc ? 'Your own data' : 'Its behavior'} says BSL-${need}.`); if(need === 3 && L.bsl === 2) upLab = upLab || L; }
    if(valid(cs, 'habitat') && cs.truth.sensitive && !L.envMatched){ F.push(`${L.name}: the environment contradicts your own habitat finding for ${cs.name}.`); matchLab = matchLab || L; }
    if(ANIMAL(cs) && cs.stress > .75) F.push(`${L.name}: ${cs.name} is pacing and testing the glass. Stressed animals breach.`);
  }
  const inj = onStation().filter(a => a.injured).length;
  if(inj) F.push(`${inj} injured tech${inj > 1 ? 's' : ''} on the roster with no incident review filed.`);
  if(!F.length){ notify('calderon', surprise ? 'Surprise walkthrough clean. I looked hard.' : 'Walkthrough clean. No violations found.'); return; }
  if(caught && !S.enforced) choices.push({label:'Enforce decon protocol', act:() => { S.enforced = true; log('calderon', 'admin', 'Decon protocol enforced. Lab exits are now checked. Work runs about 8% slower.'); if(S.lead === 'vasko') say('vasko', 'angry', 'Checked exits. Wonderful. Science at the speed of paperwork.', {kind:'note'}); }});
  if(fixLab) choices.push({label:`Repair ${fixLab.name} (18 cr)`, act:() => { S.funds -= 18; fixLab.integrity = Math.min(100, fixLab.integrity + 30); log('ops', 'admin', `${fixLab.name} repaired after walkthrough.`); }});
  if(upLab) choices.push({label:`Upgrade ${upLab.name} to BSL-3 (35 cr)`, act:() => { S.funds -= 35; upLab.bsl = 3; log('ops', 'admin', `${upLab.name} upgraded to BSL-3 after walkthrough.`); }});
  if(matchLab) choices.push({label:`Match ${matchLab.name}'s habitat (10 cr)`, act:() => { S.funds -= 10; matchLab.envMatched = true; log('ops', 'admin', `${matchLab.name} environment matched.`); }});
  choices.push({label:'Noted', act:() => {}});
  say('calderon', F.length > 2 ? 'angry' : 'uneasy', `${surprise ? 'Surprise walkthrough' : 'Walkthrough'} findings. ${F.join(' ')}`, {kind:'warning', choices});
}


// ---- 26-breach.js
/* ================= breach ================= */
function startBreach(sp, cause){
  const L = labOf(sp) || S.labs[0];
  S.breach = {stage:1, sp:sp.id, lab:L.k}; { const q = labNode(L, LAB_CU, 2); C.u = q.u; C.v = q.v; }
  dropItemsFor(sp, 'to the breach');
  const inLab = actors().filter(a => a.inLab && a.kind === 'tech');
  if(inLab.length && sp.truth.lethal && rnd() < (L.bsl >= sp.truth.bsl ? .3 : .5)) killTech(pick(inLab), 'containment breach');
  for(const a of actors()){ if(a.inLab || a.task === 'work'){ a.task = 'idle'; const k = a.labK; a.inLab = false; a.path = [labNode(S.labs[k], 6.4, 2.0)].concat(exitPath(k, a), [homeNode(a)]); } }
  say('ops', 'alarmed', `CONTAINMENT BREACH in ${L.name} ${cause}. ${ANIMAL(sp) ? `${sp.name} is out of its tank` : `${sp.name} has escaped as an aerosol`} and loose in the lab. Choose a failsafe.`, {kind:'warning'});
  S.dirty = true;
}
const FAILSAFES = [
  {id:'lock', name:'Lock down the lab', max:1, desc:'Seal the lab and flood it with sedative gas or sterilant.'},
  {id:'seal', name:'Seal the spoke', max:2, desc:'Blast doors between the labs and the hub. Anyone inside stays inside.'},
  {id:'vent', name:'Vent the lab to vacuum', max:2, desc:'Certain. Kills the specimen and anyone in the lab. The lab is out for a day.'},
  {id:'detach', name:'Detach the lab', max:3, desc:'Drop the whole lab into the black hole. You can rebuild it later.'},
  {id:'scuttle', name:'Scuttle the science vessel', max:4, desc:'The last failsafe. Drop the air-gapped vessel into the black hole and restart.'}
];
function breachLab(){ return S.breach ? S.labs[S.breach.lab] : S.labs[0]; }
function failOdds(id){
  const L = breachLab();
  if(id === 'lock') return clamp((L.bsl >= 3 ? .85 : .55) * (.5 + L.integrity / 200), .05, .95);
  if(id === 'seal') return L.bsl >= 3 ? .95 : .85;
  return 1;
}
function recontain(text){
  const sp = specById(S.breach.sp), L = breachLab();
  S.breach = null; { const q = labNode(L, LAB_CU, 2); C.u = q.u; C.v = q.v; }
  if(sp){ sedateSpec(sp); sp.stress = clamp(sp.stress + .3, .1, 1); }
  say('ops', 'neutral', text, {kind:'note'});
}
function doFailsafe(id){
  const b = S.breach; if(!b) return;
  const fs = FAILSAFES.find(f => f.id === id); if(b.stage > fs.max) return;
  const sp = specById(b.sp), L = breachLab();
  if(id === 'lock'){
    if(rnd() < failOdds('lock')){ L.integrity = Math.max(0, L.integrity - 12); L.haltUntil = S.t + 12; recontain(`${L.name} locked down. ${sp.name} is contained again. Integrity reduced. Lockdown lifts in 12 hours.`); }
    else escalate('The lockdown failed. The door seals did not hold.');
  } else if(id === 'seal'){
    if(rnd() < failOdds('seal')){
      if(rnd() < .4){ const v = onStation().find(a => !a.injured); if(v) killTech(v, 'sealed in the spoke during the breach'); }
      L.integrity = Math.max(0, L.integrity - 8); L.haltUntil = S.t + 24;
      recontain(`Spoke sealed. A retrieval team recovered ${sp.name}. ${L.name} is halted for 24 hours.`);
    } else escalate('The spoke doors jammed halfway.');
  } else if(id === 'vent'){
    if(rnd() < .5){ const v = onStation()[0]; if(v) killTech(v, 'venting of the lab'); }
    sp.alive = false; sp.loc = 'dead'; L.specId = null; S.breach = null; L.integrity = Math.max(0, L.integrity - 25); L.haltUntil = S.t + 24;
    say('ops', 'neutral', `${L.name} was vented. ${sp.name} is dead, and so is every study on it. The lab is out for 24 hours.`, {kind:'warning'});
  } else if(id === 'detach'){
    sp.alive = false; sp.loc = 'dead'; L.specId = null; L.built = false; L.destroyed = true; L.bsl = 2; L.envMatched = false; L.fault = false; S.breach = null;
    say('ops', 'neutral', `${L.name} has been detached. It is falling toward the black hole with ${sp.name} inside. You can rebuild it from the Station tab.`, {kind:'warning'});
    G.g++; saveG();
  } else if(id === 'scuttle') endRun('scuttle');
  S.dirty = true;
}
function escalate(reason){
  const b = S.breach; b.stage++;
  const sp = specById(b.sp);
  if(b.stage >= 3 && sp.truth.lethal && rnd() < .35){ const v = pick(onStation()); if(v) killTech(v, `${sp.name} reached the ${b.stage === 3 ? 'hub' : 'shuttle bay'}`); }
  if(b.stage > 4){ endRun('overrun'); return; }
  say('ops', 'alarmed', `${reason ? reason + ' ' : ''}${sp.name} is now ${BREACH_WHERE[b.stage]}.`, {kind:'warning'});
  S.dirty = true;
}


// ---- 27-tick.js
/* ================= tick ================= */
function tick(){
  S.t++;
  S.funds -= upkeepPerHour();
  for(const L of S.labs){
    if(L.built) L.integrity = clamp(L.integrity - (S.funds < 0 ? 0.25 : 0.03) * (hasSpecialist('engineer') ? 0.55 : 1), 0, 100);
    if(L.building && S.t >= L.building.until){
      L.building = null; L.built = true; L.destroyed = false; L.integrity = 95;
      const head = assignHead(L);
      notify('pruitt', `${LAB_TYPES[L.type].holds.length ? `${L.name} is finished and open for a specimen.` : `${L.name} is online. ${LAB_TYPES[L.type].blurb}`}${head ? ` ${head.name} runs it.` : ` Nobody qualified is free to run it, so it works at half pace until you hire a ${ROLES[headRoleFor(L)].label.toLowerCase()}.`}`); camFit();
      placeHeld();
    }
    const cs = labSpec(L);
    if(cs){ const mis = cs.truth.sensitive && !L.envMatched; cs.stress = clamp(cs.stress + (mis ? .004 : -.006), .1, 1); }
    if(L.built && cs && !L.fault && rnd() < 0.004 * (1 + (100 - L.integrity) / 40) * (hasSpecialist('engineer') ? 0.5 : 1)) L.fault = true;
  }
  for(const sp of S.specs){ if(!sp.alive || !ANIMAL(sp)) continue; sp.sed *= Math.pow(0.5, 1 / sp.truth.sedHalf); if(sp.sed < .01) sp.sed = 0; }
  stepSchedule();
  if(S.over) return;
  if(S.mission && S.t >= S.mission.start + S.mission.dur * 2) missionReturn();

function plannerHit(x, y){

}
document.addEventListener('pointerdown', e => {

function act(a){
  const [k, v] = a.split(':');
  if(k === 'tab'){ S.ui.tab = v; S.dirty = true; return; }
  if(k === 'speed'){ if(S.phase === 'evening' && +v) return; S.speed = +v; if(S.speed){ S.lastSpeed = S.speed; S.ui.planner = false; if(S.phase === 'morning') S.phase = 'shift'; } renderTop(); S.dirty = true; return; }
  if(k === 'zoom'){ zoomBy(+v); return; }
  if(k === 'newrun'){
    if(S.over){ newRun(); return; }
    say('ops', 'neutral', 'Starting a new survey ends this one. Nothing from Rim Station 7 carries over. Save the run first if you want to come back to it.', {log:false, choices:[
      {label:'Start a new survey', act:() => newRun()},
      {label:'Keep this run', act:() => { S.dirty = true; }}
    ]});
    return;
  }
  if(k === 'save'){ const why = writeSlot(v); notify('ops', why || `Run saved to slot ${v}.`, 'admin'); S.dirty = true; return; }
  if(k === 'load'){ const why = loadSlot(v); if(why) notify('ops', why, 'admin'); S.dirty = true; return; }
  if(k === 'delsave'){ deleteSlot(v); S.dirty = true; return; }
  if(S.over) return;
  const sp = selSpec();
  switch(k){
    case 'spec': S.ui.spec = v; S.ui.sel = 'obs'; S.ui.studyOpen = false; break;
    case 'sel': S.ui.sel = v; S.ui.studyOpen = true; break;
    case 'study-close': S.ui.studyOpen = false; break;
    case 'report': S.ui.report = v; break;
    case 'unfocus': S.ui.focus = null; break;
    case 'dossier': S.ui.spec = v; S.ui.tab = 'research'; S.ui.studyOpen = false; break;
    case 'plan': S.ui.spec = v; S.ui.sel = a.split(':')[2]; S.ui.tab = 'research'; S.ui.studyOpen = true; break;
    case 'report-close': S.ui.report = null; break;
    case 'report-publish': S.ui.report = null; S.ui.tab = 'papers'; break;
    case 'planet': S.ui.planet = +v; S.ui.planetPicked = true; break;
    case 'begin': { const n = S.items.length; scheduleExp(); if(S.items.length > n) S.ui.studyOpen = false; break; }
    case 'cancel': { const it = S.items.find(x => x.id === v); if(it) cancelItem(it); break; }
    case 'ot': authorizeOT(); break;
    case 'startday': startDay(); break;
    case 'planner': S.ui.planner = true; S.ui.studyOpen = false; break;
    case 'planner-close': S.ui.planner = false; break;
    case 'evening': S.ui.evening = true; break;
    case 'evening-hide': S.ui.evening = false; break;
    case 'mission-open': S.ui.mission = true; break;
    case 'mission-close': S.ui.mission = false; break;
    case 'closeday': closeDay(); break;
    case 'otd': authorizeOTDay(+v); break;
    case 'tadd': case 'qjob': {
      const w = k === 'tadd' ? parseKey(a.slice(5)) : {kind:'job', type:v, tgt:a.split(':')[2]};
      if(w.kind === 'study'){ S.ui.spec = w.sp; S.ui.sel = w.type; S.ui.studyOpen = true; }
      else { const why = workBlock(w, S.ui); if(why) notify('ops', why, 'admin'); else makeItem(w, S.ui); }
      break;
    }
    case 'cmp': { const [, how, id] = a.split(':'), c = tgtCompound(id); if(!c) break;
      if(how === 'lic') licenseCompound(c); else if(how === 'dir') sellCompound(c); else if(how === 'hold') c.state = 'held';
      else { c.state = how; log('ops', 'admin', `${c.name} sent to the ${how === 'micro' ? 'Micro' : 'Chem'} Lab.`); }
      break; }
    case 'mat': { const m = tgtMaterial(a.split(':')[2]); if(m && m.stressed && m.state === 'held'){ m.state = 'licensed'; S.funds += m.value; log('pruitt', 'admin', `Licensed ${m.name} data: +${m.value} cr.`); } break; }
    case 'assign': assignLead(v); break;
    case 'pull': pullLead(false); break;
    case 'dispatch': { S.ui.planetPicked = true; const before = S.mission; dispatch(S.planets[+v]); if(!before && S.mission) S.ui.mission = false; break; }
    case 'build': buildLab(+v); break;
    case 'ship': releaseSpec(specById(v), 'ship'); break;
    case 'euth': releaseSpec(specById(v), 'euth'); break;
    case 'tut-off': S.tut.on = false; break;
    case 'hire': hireStaff(v); break;
    case 'benchonly': { const a = byId(v); if(a) a.benchOnly = !a.benchOnly; break; }
    case 'hazard': S.hazardPay = true; S.slowdown = false; log('bea', 'admin', 'Hazard pay approved. Techs back to normal pace.'); break;
    case 'bsl-up': { if(!canDecide()){ notify('pruitt', 'Maintenance is scheduled at the end of the shift.', 'admin'); break; } const L = S.labs[+v]; const o = budgetTag(35); S.funds -= 35; L.bsl = 3; log('ops', 'admin', `${L.name} upgraded to BSL-3.${o ? ' Approved, ' + o + '.' : ''}`); break; }
    case 'bsl-down': { if(!canDecide()){ notify('pruitt', 'Maintenance is scheduled at the end of the shift.', 'admin'); break; } const L = S.labs[+v]; L.bsl = 2; log('ops', 'admin', `${L.name} downgraded to BSL-2 to save upkeep.`); break; }
    case 'repair': { if(!canDecide()){ notify('pruitt', 'Maintenance is scheduled at the end of the shift.', 'admin'); break; } const L = S.labs[+v]; const o = budgetTag(18); S.funds -= 18; L.integrity = Math.min(100, L.integrity + 30); log('ops', 'admin', `${L.name} repaired: +30% integrity.${o ? ' Approved, ' + o + '.' : ''}`); break; }
    case 'match': { if(!canDecide()){ notify('pruitt', 'Maintenance is scheduled at the end of the shift.', 'admin'); break; } const L = S.labs[+v], cs = labSpec(L); if(cs){ const o = budgetTag(10); S.funds -= 10; L.envMatched = true; log('ops', 'admin', `${L.name} environment matched to ${cs.name}.${o ? ' Approved, ' + o + '.' : ''}`); } break; }
    case 'publish-open': openPublish(); break;
    case 'publish-cancel': $('#pub').hidden = true; break;
    case 'publish-confirm': { const rec = +((document.querySelector('input[name="rec"]:checked') || {}).value || 2); $('#pub').hidden = true; if(sp) publish(sp, rec); break; }
    case 'retract': if(sp) retract(sp); break;
    case 'surprise': if(!S.inspector && !S.breach && S.t - S.lastSurprise >= 24) startWalkthrough('surprise'); break;
    case 'close-study': endRun('closed'); break;
    case 'fs': doFailsafe(v); break;
    case 'hold': escalate(''); break;
  }
  tutTick();
  S.dirty = true;
}

function mapPos(c, q){
  const cx = c.width * .5, cy = c.height * .47, rx = c.width * .43, ry = c.height * .38;
  const rad = .38 + (q.dist - 14) / 16 * .55, a = q.i * 2.4 + (S.seed % 7) * .5;
  return [Math.round(clamp(cx + Math.cos(a) * rad * rx, 30, c.width - 30)), Math.round(clamp(cy + Math.sin(a) * rad * ry, 14, c.height - 34))];
}
function drawStarMap(c, t){
  const g = c.getContext('2d'), W = c.width, H = c.height;
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#0a0616'; g.fillRect(0, 0, W, H);
  const rs = mulberry(S.seed);
  for(let i = 0; i < 140; i++){ const a = .2 + rs() * .8; g.fillStyle = `rgba(230,220,255,${a * (.6 + .4 * Math.sin(t * 1.5 + i))})`; g.fillRect(Math.floor(rs() * W), Math.floor(rs() * H), 1, 1); }
  const neb = g.createRadialGradient(W * .75, H * .3, 4, W * .75, H * .3, W * .5); neb.addColorStop(0, 'rgba(120,60,170,.22)'); neb.addColorStop(1, 'rgba(120,60,170,0)'); g.fillStyle = neb; g.fillRect(0, 0, W, H);
  const cx = W * .5, cy = H * .47;
  g.strokeStyle = 'rgba(161,148,192,.25)'; g.setLineDash([2, 4]);
  for(const f of [.38, .65, .93]){ g.beginPath(); g.ellipse(cx, cy, W * .43 * f, H * .38 * f, 0, 0, Math.PI * 2); g.stroke(); }
  g.setLineDash([]);
  g.strokeStyle = 'rgba(255,150,90,.7)'; g.lineWidth = 2; g.beginPath(); g.ellipse(cx, cy, 13, 3.5, -.15, 0, Math.PI * 2); g.stroke(); g.lineWidth = 1;
  g.fillStyle = '#000'; g.beginPath(); g.arc(cx, cy, 6, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(255,225,180,.9)'; g.beginPath(); g.arc(cx, cy, 6.5, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#e2e8f0'; g.fillRect(cx + 9, cy - 9, 4, 3); g.fillStyle = '#62d6e3'; g.fillRect(cx + 10, cy - 8, 2, 1);
  g.font = '10px "Silkscreen", monospace'; g.fillStyle = '#a194c0'; g.fillText('R7', cx + 15, cy - 6);
  if(S.mission){
    const q = S.planets[S.mission.planet], [qx, qy] = mapPos(c, q), f = (S.t - S.mission.start) / (S.mission.dur * 2), f2v = f < .5 ? f * 2 : (1 - f) * 2;
    g.strokeStyle = 'rgba(243,154,43,.6)'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(cx + 11, cy - 7); g.lineTo(qx, qy); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#f39a2b'; g.fillRect(Math.round(cx + 11 + (qx - cx - 11) * f2v) - 1, Math.round(cy - 7 + (qy - cy + 7) * f2v) - 1, 3, 3);
  }
  for(const q of S.planets){
    const [qx, qy] = mapPos(c, q);
    if(!q.known) continue;
    g.drawImage(planetCanvas(q), qx - 10, qy - 10, 20, 20);
    if(q.i === S.ui.planet){ g.strokeStyle = '#f39a2b'; g.beginPath(); g.arc(qx, qy, 14 + Math.sin(t * 3), 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = q.i === S.ui.planet ? '#ece7f6' : '#a194c0'; g.font = '10px "Silkscreen", monospace';
    const label = q.name, tw = g.measureText(label).width;
    g.fillText(label, clamp(qx - tw / 2, 3, W - tw - 3), qy + 21);
  }
}

function thoughtFor(a){
  const sp = focusSpecFor(a), t = sp ? sp.truth : null, key = actorKey(a);
  /* Two pools. C is what the work is telling them right now and carries the
     suggestions the UI acts on; P is who they are. Both get airtime, because a
     roster you paid for should have a voice and not just a stat block. */
  const C = [], P = [];
  const add = (mood, text, suggest) => C.push({mood, text, suggest:suggest || null});
  const addP = (mood, text) => P.push({mood, text, suggest:null});
  const recentSed = sp && ANIMAL(sp) && sinceSed(sp) !== null && sinceSed(sp) < 24;
  if(key === 'calderon'){
    const L = S.labs.find(L => L.built && L.integrity < 60);
    if(S.inspector && S.inspector.caught) add('angry', `${S.inspector.caught} decon skip${S.inspector.caught > 1 ? 's' : ''} so far. All of them going in the report.`);
    if(L) add('uneasy', `${L.name}'s seals are at ${Math.round(L.integrity)}%. That's not a maintenance note, that's a countdown.`);
    if(sp && claimFor(sp, 'containment') && (labOf(sp) || S.labs[0]).bsl < t.bsl) add('alarmed', `${sp.name} needs BSL-${t.bsl} and you have it in BSL-${(labOf(sp) || S.labs[0]).bsl}. Your own paper says so.`);
    add('neutral', 'Checking the log against what I see on the floor. They never match exactly.');
    return C[0];
  }
  if(sp){
    const motile = ANIMAL(sp);
    if(key === 'okafor'){
      if(sp.flags.has('vocal') && !found(sp, 'acoustic')) add('uneasy', `Those calls aren't noise. I want the acoustic work done before we do anything invasive to ${sp.name} again.`, 'acoustic');
      if(t.sapience === 3 && !sp.flags.has('vocal')) add('uneasy', `${sp.name} watched me write. Not my hand. The pen. I want a proper observation before anyone sedates it again.`, 'obs');
      if(recentSed) add('uneasy', `Another sedation. Every dose costs it something, and every dose muddies our behavior data. How long does this drug actually last in it?`, 'clearance');
      if(sp.stress > .6) add('uneasy', `${sp.name} is stressed. Stressed animals breach, and stressed data lies. Is the habitat matched?`, 'habitat');
      if(!claimFor(sp, 'containment') && sp.grantTier >= 1) add('neutral', "We're guessing at containment. I don't like guessing. A challenge test would end the argument.", 'challenge');
      if(!valid(sp, 'assay') && found(sp, 'sample')) add('neutral', "The sample's sitting in the fridge. Assay it before we handle the animal again.", 'assay');
      add('neutral', motile ? 'Replicates. Then more replicates. Then I believe it.' : `I keep coming back to how ${sp.name} grows. There's something orderly about it.`);
    } else if(key === 'vasko'){
      if(motile && t.agg > .6) add('excited', `Did you see ${sp.name} hit the glass? That's a paper. Put a prey model in there and film it.`, 'stimulus');
      if(t.yield && valid(sp, 'assay')) add('excited', `There's a compound in ${sp.name} worth more than this station. Extract it before somebody else does.`, 'extract');
      if(sp.flags.has('viable') || (!found(sp, 'genome') && found(sp, 'sample'))) add('smug', `Sequence it, clone it, and Rook never has to fly out for another one.`, 'genome');
      if(recentSed) add('smug', `Okafor wants a washout every time we touch it. The data's fine.`);
      add('smug', 'Okafor would still be calibrating the scale.');
    } else {
      if(motile && t.agg > .6 && !valid(sp, 'stimulus')) add('uneasy', `${sp.name} tracks me every time I walk past the tank. Nobody's tested what it does when it gets close.`, 'stimulus');
      if(!valid(sp, 'assay') && sp.kind !== 'fossil') add('uneasy', `We still don't know what ${sp.name} puts out. I'm double-gloving until somebody runs the assay.`, 'assay');
      if(t.vocal && !sp.flags.has('vocal')) add('neutral', `Swear I heard ${sp.name} hum when the lights went down. Probably the vents.`, 'obs');
      if(t.lethal && valid(sp, 'assay')) add('uneasy', `Knowing ${sp.name} can kill you doesn't make the transfer box any lighter.`);
      if(sp.stress > .6) add('uneasy', `${sp.name} is pacing again. That's not a happy animal.`, 'habitat');
      if(recentSed) add('neutral', `It's slow coming round from the sedative. Slower than last time.`, 'clearance');
      if(motile && t.agg < .38 && valid(sp, 'obs')) add('neutral', `${sp.name} came right up to the glass today. Kind of sweet, honestly.`);
    }
  }
  if(a.kind === 'tech'){
    if(a.injured) add('numb', 'Still hurts. Nobody filed anything about it.');
    if(a.flash > 0) add('uneasy', 'Skipped decon. Just once. It was fine.');
    if(S.deaths && !S.hazardPay) add('angry', 'Somebody died here and nobody has said the words hazard pay.');
    /* Who they are, in their own words. The traits the director paid for. */
    const T = n => traitsOf(a).some(x => x.label === n);
    if(a.morale < 25) addP('numb', pick2(a, ["I have started counting the shifts. That is never a good sign.", "I am not asking for much. I am asking for the rota to be posted before the shift it covers."]));
    if(T('Glory hound')) addP('smug', pick2(a, ["My name goes on this one. I have checked how that works.", "Nobody remembers who ran the controls. They remember who wrote it up."]));
    if(T('Squeamish')) addP('uneasy', pick2(a, ["I will do anything you like at the bench. Anything at all, at the bench.", "It looked at me. I am aware that is not a finding."]));
    if(T('By the book')) addP('neutral', pick2(a, ["Every step, every time. It is not slower. It is correct, which people confuse with slower.", "I have the procedure laminated. People find that funny until something gets out."]));
    if(T('Fast hands')) addP('excited', pick2(a, ["Done before the timer. Again.", "There is a quick way and a right way and most days they are the same way."]));
    if(T('Careless')) addP('smug', pick2(a, ["Decon is for people who touch things.", "Nothing has gone wrong yet, which I treat as evidence."]));
    if(T('Veteran')) addP('neutral', pick2(a, ["I have seen a cell go. You do not forget which way the door opens.", "The new lead has ideas. I have a list of people who had ideas."]));
    if(T('Green')) addP('uneasy', pick2(a, ["I have read the manual twice. It does not cover the smell.", "Everyone here is very calm and I do not know whether that is comforting."]));
    if(T('Quiet')) addP('neutral', pick2(a, ["I keep my head down. It is not that I do not notice things.", "I could say something. I usually do not."]));
    if(T('Insomniac')) addP('neutral', pick2(a, ["Better at 2am than I am at 9. I have stopped apologising for it.", "The station is honest at night. Nobody is performing."]));
    if(T('Steady')) addP('neutral', pick2(a, ["Panicking has never once helped and I have tested that twice.", "Somebody has to be the one who walks."]));
    if(T('Ambitious') && !a.workedRecently) addP('uneasy', pick2(a, ["I did not come to the edge of the galaxy to label tubes.", "Put me on the work that matters and watch what happens."]));
    if(a.role === 'zoologist') addP('neutral', pick2(a, [`It has a routine. Everything with a brain has a routine, and the routine is the data.`, "People keep calling it an it. I keep letting them."]));
    if(a.role === 'xenobio') addP('neutral', pick2(a, ["Four billion years of evolution over there and a fortnight of my attention over here.", "Nothing in my training applies and that is the single best thing about this job."]));
    if(a.role === 'geneticist') addP('neutral', pick2(a, ["The sequencer has opinions about this genome. None of them are printable.", "I can read it. Reading it and understanding it are different purchases."]));
    if(a.role === 'micro') addP('neutral', pick2(a, ["Everything in here doubles while I am asleep. I take it personally.", "The cultures are fine. I say that with my whole chest and one hand on the autoclave."]));
    if(a.role === 'chemist') addP('neutral', pick2(a, ["Meridian wants it cheaper. The molecule does not care what Meridian wants.", "Synthesis is just doing it again without the animal watching."]));
    if(a.role === 'physicist') addP('neutral', pick2(a, ["There is a black hole out there and a budget meeting in here. I know which one bends more.", "The instruments are fine. The thing the instruments are pointed at is the problem."]));
    if(a.role === 'engineer') addP('neutral', pick2(a, ["Seals do not fail suddenly. They fail slowly and then suddenly, and I am paid for the slow part.", "Show me a lab nobody has complained about and I will show you a lab nobody has inspected."]));
    if(a.role === 'speech') addP('neutral', pick2(a, ["It repeated a pattern back to me. I am being careful about the word repeated.", "Meridian filed my post under expendable. I have seen the org chart."]));
    if(a.role === 'anthro') addP('neutral', pick2(a, ["Somebody made that. I am not allowed to write it that plainly yet.", "Every culture that found another one has a word for the day it went wrong."]));
    addP('neutral', pick2(a, ['Twelve hours till rotation.', "The coffee in the hub's cold again.", 'I miss weather.', 'Rook says the planets smell like something. Wish I knew what.', 'There is a form for this. There is a form for everything except the thing that happened.', "Payroll call it a remote posting. Remote from what, I asked. No reply."]));
  }
  /* Alternate between the two pools every few hours, rotating inside each, so a
     person says something about the work and then something about themselves. */
  const turn = Math.floor(S.t / 4) + key.length;
  const pool = P.length && (!C.length || turn % 2) ? P : C;
  if(!pool.length) return null;
  return pool[Math.floor(S.t / 9 + key.length) % pool.length];
}
function pick2(a, arr){ return arr[(a.name.length + Math.floor(S.t / 8)) % arr.length]; }
function doingFor(a){
  if(a === S.inspector) return 'Running a safety walkthrough';
  if(a.injured) return 'Injured, off rotation';
  const job = a.job && S.items.find(x => x.id === a.job); if(job) return `${job.lane === 'bench' ? 'At the hub bench' : `In ${laneLab(job.lane) ? laneLab(job.lane).name : 'the lab'}`}: ${wName(job).toLowerCase()}`;
  if(a.inLab) return `In ${S.labs[a.labK].name}`;
  if(a.walking) return 'Walking the station';

}
function suggestBtn(sp, id){

  return STUDIES[id].tier > sp.grantTier + 1 ? `<span class="muted small">${STUDIES[id].name(sp)} opens at Tier ${STUDIES[id].tier}.</span>` : '';
}
function renderInspect(){

    html = `<div class="ins-h"><canvas class="ins-sp" data-spec="${sp.id}" width="36" height="26"></canvas><div><b>${sp.name}</b><small>${sp.code} · ${KIND_LABEL[sp.kind]} · ${L ? `${L.name}, BSL-${L.bsl}` : 'Stasis'}</small></div><button type="button" class="ins-x" data-act="unfocus" aria-label="Close">×</button></div>
      <dl class="kv">${ANIMAL(sp) ? `<dt>Right now</dt><dd>${sp.sed > .3 ? 'Sedated' : mood}</dd><dt>Last sedated</dt><dd>${h === null ? 'Never' : h + ' h ago'}</dd>` : ''}<dt>From</dt><dd>${planetOf(sp).name}</dd><dt>Paper</dt><dd>${sp.paper ? 'v' + sp.paper.v : 'None yet'}</dd></dl>
      ${(k => k.length ? `<ul class="ins-find">${k.map(sec => `<li class="on"><b>${secLabel(sp, sec)}</b><span>${claimFor(sp, sec).text}</span></li>`).join('')}</ul>` : '<p class="muted small">No findings yet.</p>')(secs.filter(sec => claimFor(sp, sec)))}
      ${(u => u.length ? `<p class="small muted"><b>Still unknown:</b> ${u.map(sec => secLabel(sp, sec)).join(', ')}</p>` : '')(secs.filter(sec => !claimFor(sp, sec)))}
      <div class="row"><button type="button" class="btn" data-act="dossier:${sp.id}">Open dossier</button></div>`;
  }
  if(el.dataset.html !== html){
    el.innerHTML = html; el.dataset.html = html;
    el.querySelectorAll('canvas[data-who]').forEach(c => { if(c.dataset.who) drawPortrait(c.getContext('2d'), c.dataset.who, c.dataset.mood); else drawTechPortrait(c, focusActor()); });

}
function drawTechPortrait(c, a){
  if(!a) return;
  const g = c.getContext('2d'), L = a.look; g.clearRect(0, 0, 16, 16);
  g.fillStyle = '#2b3446'; g.fillRect(0, 0, 16, 16);
  g.fillStyle = L.coat; g.fillRect(3, 11, 10, 5);
  g.fillStyle = L.skin; g.fillRect(5, 4, 6, 7);
  g.fillStyle = L.hair; g.fillRect(5, 3, 6, 2); g.fillRect(4, 4, 1, 3);
  g.fillStyle = '#1b1020'; g.fillRect(6, 7, 1, 1); g.fillRect(9, 7, 1, 1);
  g.fillStyle = '#7a4a3a'; g.fillRect(7, 9, 2, 1);

function kindRoom(p){

}
/* Why no team can go out right now, if that is the case. The planet-specific

function recoveryBlock(){
  if(S.mission) return '';
  const known = S.planets.filter(p => p.known);
  if(!known.length) return 'No charted worlds.';
  if(known.every(p => missionBlock(p))){
    const common = known.map(p => missionBlock(p));
    return common.every(w => w === common[0]) ? common[0] : 'No world can take a team right now.';
  }
  return '';
}

function gE(g, x, y, rx, ry, c){ g.fillStyle = c; g.beginPath(); g.ellipse(x, y, Math.max(.5, rx), Math.max(.5, ry), 0, 0, Math.PI * 2); g.fill(); }
function gF(g, x, y, w, h, c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function gL(g, x0, y0, x1, y1, c){
  g.fillStyle = c; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
